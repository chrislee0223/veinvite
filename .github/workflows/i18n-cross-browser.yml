name: VeInvite multilingual cross-browser QA

on:
  pull_request:
    paths:
      - 'src/lib/i18n/**'
      - 'src/components/RewardXPromotionPanel.tsx'
      - 'src/app/*typography*.css'
      - 'src/app/localization-final-polish.css'
      - 'tests/playwright/i18n-cross-browser-geometry.spec.ts'
      - '.github/workflows/i18n-cross-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veinvite-cross-browser-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://bpppslplhmppxzvdkwxs.supabase.co
  SUPABASE_SECRET_KEY: ci-placeholder-not-a-real-key
  VERCEL_ENV: preview
  VECHAIN_NETWORK: testnet
  NEXT_PUBLIC_NETWORK_TYPE: test
  VEINVITE_QA_STUDIO: 'true'
  VEINVITE_PLAYWRIGHT_PREBUILT: 'true'

jobs:
  alternate-engines:
    name: Localized geometry / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install test dependencies and script-aware fonts
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core fonts-noto-cjk
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build isolated preview/testnet QA app
        run: npm run build
      - name: Check 29 languages, 3 viewport widths and enlarged text
        run: npx playwright test tests/playwright/i18n-cross-browser-geometry.spec.ts --browser=${{ matrix.browser }} --workers=4
      - name: Upload rendered screens and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-cross-browser-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7
