name: Network regression

on:
  pull_request:
    paths:
      - 'src/components/AppGuide.tsx'
      - 'src/components/AppNetwork*.tsx'
      - 'src/components/NetworkInteractionSafety.tsx'
      - 'src/qa/QaNetwork*.tsx'
      - 'tests/network-*.test.mjs'
      - '.github/workflows/network-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run every Network regression test
        run: node --test tests/network-*.test.mjs
