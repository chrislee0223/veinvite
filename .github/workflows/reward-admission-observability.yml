name: Reward Admission Observability Contract
on:
  pull_request:
    paths:
      - 'src/lib/rewards/rewardAdmissionBridgeContract.ts'
      - 'src/lib/rewards/readStagedAdmissionFundingStatus.ts'
      - 'tests/reward-admission-bridge-contract.test.mjs'
      - '.github/workflows/reward-admission-observability.yml'
  push:
    branches:
      - main
    paths:
      - 'src/lib/rewards/rewardAdmissionBridgeContract.ts'
      - 'src/lib/rewards/readStagedAdmissionFundingStatus.ts'
      - 'tests/reward-admission-bridge-contract.test.mjs'
      - '.github/workflows/reward-admission-observability.yml'
permissions:
  contents: read
jobs:
  validate-disabled-admission-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run read-only accounting contract tests
        run: node --experimental-strip-types --test tests/reward-admission-bridge-contract.test.mjs
