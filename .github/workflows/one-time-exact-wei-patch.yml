name: One-time exact-wei payout patch

on:
  push:
    branches:
      - fix/exact-wei-automatic-payout

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic source patch
        run: python scripts/one_time_exact_wei_patch.py

      - name: Remove one-time helpers
        run: |
          git rm .github/workflows/one-time-exact-wei-patch.yml
          git rm scripts/one_time_exact_wei_patch.py

      - name: Commit exact-wei worker fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/rewards/automaticRewardPayout.ts
          git commit -m 'fix: preserve exact wei in automatic payout manifests'
          git push origin HEAD:fix/exact-wei-automatic-payout
