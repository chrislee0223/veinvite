name: Notification final integrity temp patch

on:
  push:
    branches:
      - fix/notification-final-integrity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notification-final-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused notification fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          center = 'src/components/UnifiedInviteNotificationHistoryCenter.tsx'
          replace_once(center,
          """function shortWallet(value: string | null): string | null {\n  if (!value || !/^0x[0-9a-f]{40}$/iu.test(value)) return null;\n  return `${value.slice(0, 6)}…${value.slice(-4)}`;\n}\n\n""",
          "")
          replace_once(center,
          """  unreadCount,\n  open,\n""",
          """  unreadCount,\n  markAllAvailable,\n  open,\n""")
          replace_once(center,
          """  unreadCount: number;\n  open: boolean;\n""",
          """  unreadCount: number;\n  markAllAvailable: boolean;\n  open: boolean;\n""")
          replace_once(center,
          """  const actionRequestRef = useRef(0);\n  const [clockTick, setClockTick] = useState(0);\n""",
          """  const actionRequestRef = useRef(0);\n  const receiptRequestRef = useRef(0);\n  const [clockTick, setClockTick] = useState(0);\n""")
          replace_once(center,
          """    if (!open) {\n      actionRequestRef.current += 1;\n      setRewardActions([]);\n""",
          """    if (!open) {\n      actionRequestRef.current += 1;\n      receiptRequestRef.current += 1;\n      setRewardActions([]);\n""")
          replace_once(center,
          """  const openRewardReceipt = useCallback(async (\n    item: InviteNotificationHistoryItem,\n  ) => {\n    setReceipt(null);\n    setReceiptLoading(true);\n    setReceiptError('');\n\n    try {\n      const response = await fetch(\n        `/api/rewards/receipts?inviteCode=${encodeURIComponent(item.inviteCode)}`,\n        { cache: 'no-store' },\n      );\n      const body = (await response.json()) as ReceiptResponse;\n      if (!response.ok) {\n        throw new Error(body.error || receiptCopy.error);\n      }\n\n      const match = body.receipts?.[0];\n      if (!match) {\n        throw new Error(receiptCopy.error);\n      }\n      setReceipt(match);\n    } catch (error) {\n      setReceiptError(\n        error instanceof Error ? error.message : receiptCopy.error,\n      );\n    } finally {\n      setReceiptLoading(false);\n    }\n  }, [receiptCopy.error]);\n""",
          """  const openRewardReceipt = useCallback(async (\n    item: InviteNotificationHistoryItem,\n  ) => {\n    const requestId = receiptRequestRef.current + 1;\n    receiptRequestRef.current = requestId;\n    setReceipt(null);\n    setReceiptLoading(true);\n    setReceiptError('');\n\n    try {\n      const response = await fetch(\n        `/api/rewards/receipts?inviteCode=${encodeURIComponent(item.inviteCode)}`,\n        { cache: 'no-store' },\n      );\n      const body = (await response.json()) as ReceiptResponse;\n      if (response.status === 401 || response.status === 403) {\n        notifyRewardClaimSessionInvalid();\n      }\n      if (!response.ok) {\n        throw new Error(body.error || receiptCopy.error);\n      }\n      if (receiptRequestRef.current !== requestId) return;\n\n      const match = body.receipts?.[0];\n      if (!match) {\n        throw new Error(receiptCopy.error);\n      }\n      setReceipt(match);\n    } catch (error) {\n      if (receiptRequestRef.current !== requestId) return;\n      setReceiptError(\n        error instanceof Error ? error.message : receiptCopy.error,\n      );\n    } finally {\n      if (receiptRequestRef.current === requestId) {\n        setReceiptLoading(false);\n      }\n    }\n  }, [receiptCopy.error]);\n""")
          replace_once(center,
          """  const acknowledgeReceipt = useCallback(async () => {\n    if (!receipt || receipt.seen || receiptAcknowledging) return;\n\n    setReceiptAcknowledging(true);\n    setReceiptError('');\n    try {\n      const response = await fetch(\n        `/api/rewards/receipts/${encodeURIComponent(receipt.id)}/seen`,\n""",
          """  const acknowledgeReceipt = useCallback(async () => {\n    if (!receipt || receipt.seen || receiptAcknowledging) return;\n\n    const requestId = receiptRequestRef.current;\n    setReceiptAcknowledging(true);\n    setReceiptError('');\n    try {\n      const response = await fetch(\n        `/api/rewards/receipts/${encodeURIComponent(receipt.id)}/seen`,\n""")
          replace_once(center,
          """      const body = (await response.json()) as ReceiptSeenResponse;\n      if (!response.ok || !body.receipt) {\n        throw new Error(body.error || receiptCopy.error);\n      }\n\n      setReceipt(body.receipt);\n      window.dispatchEvent(\n        new Event(REWARD_RECEIPT_ACKNOWLEDGED_EVENT),\n      );\n    } catch (error) {\n      setReceiptError(\n        error instanceof Error ? error.message : receiptCopy.error,\n      );\n    } finally {\n      setReceiptAcknowledging(false);\n    }\n""",
          """      const body = (await response.json()) as ReceiptSeenResponse;\n      if (response.status === 401 || response.status === 403) {\n        notifyRewardClaimSessionInvalid();\n      }\n      if (!response.ok || !body.receipt) {\n        throw new Error(body.error || receiptCopy.error);\n      }\n\n      window.dispatchEvent(\n        new Event(REWARD_RECEIPT_ACKNOWLEDGED_EVENT),\n      );\n      if (receiptRequestRef.current !== requestId) return;\n      setReceipt(body.receipt);\n    } catch (error) {\n      if (receiptRequestRef.current !== requestId) return;\n      setReceiptError(\n        error instanceof Error ? error.message : receiptCopy.error,\n      );\n    } finally {\n      if (receiptRequestRef.current === requestId) {\n        setReceiptAcknowledging(false);\n      }\n    }\n""")
          replace_once(center,
          """  const closePanel = useCallback(() => {\n    if (!open || closeTimerRef.current !== null) return;\n\n    const reducedMotion =\n""",
          """  const closePanel = useCallback(() => {\n    if (!open || closeTimerRef.current !== null) return;\n\n    receiptRequestRef.current += 1;\n    const reducedMotion =\n""")
          replace_once(center,
          """        if (receipt || receiptLoading || receiptError) {\n          setReceipt(null);\n""",
          """        if (receipt || receiptLoading || receiptError) {\n          receiptRequestRef.current += 1;\n          setReceipt(null);\n""")
          replace_once(center,
          """  const renderItemContent = (\n    item: InviteNotificationHistoryItem,\n    unread: boolean,\n  ) => {\n    const copy = itemCopy(item, supportedLocale);\n    const friend = shortWallet(item.friendWallet);\n\n    return (\n""",
          """  const renderItemContent = (\n    item: InviteNotificationHistoryItem,\n    unread: boolean,\n  ) => {\n    const copy = itemCopy(item, supportedLocale);\n    const showMeta = Boolean(copy.hint || item.kind === 'REWARD_PAID');\n\n    return (\n""")
          replace_once(center,
          """        <span className=\"notificationHistoryBody\">{copy.body}</span>\n        <span className=\"notificationHistoryMeta\">\n          {friend ? (\n            <span className=\"notificationFriendMeta\">\n              <span className=\"notificationFriendLabel\">\n                {metaCopy.invitedFriend}\n              </span>\n              <span className=\"notificationFriendWallet\" dir=\"ltr\">\n                ({friend})\n              </span>\n            </span>\n          ) : null}\n          {copy.hint ? <b>{copy.hint}</b> : null}\n          {item.kind === 'REWARD_PAID' ? (\n            <span className=\"notificationReceiptAction\">\n              <span>{metaCopy.viewReceipt}</span>\n              <em aria-hidden=\"true\">›</em>\n            </span>\n          ) : null}\n        </span>\n""",
          """        <span className=\"notificationHistoryBody\">{copy.body}</span>\n        {showMeta ? (\n          <span className=\"notificationHistoryMeta\">\n            {copy.hint ? <b>{copy.hint}</b> : null}\n            {item.kind === 'REWARD_PAID' ? (\n              <span className=\"notificationReceiptAction\">\n                <span>{metaCopy.viewReceipt}</span>\n                <em aria-hidden=\"true\">›</em>\n              </span>\n            ) : null}\n          </span>\n        ) : null}\n""")
          replace_once(center,
          """          const amount = formatB3trWei(action.reservedAmountWei) ?? '—';\n          const friend = shortWallet(action.friendWallet);\n          const pending = claimPendingCode === action.inviteCode;\n""",
          """          const amount = formatB3trWei(action.reservedAmountWei) ?? '—';\n          const pending = claimPendingCode === action.inviteCode;\n""")
          replace_once(center,
          """                <small className=\"notificationActionMeta\">\n                  {friend ? (\n                    <span className=\"notificationActionMetaItem\">\n                      <span>{metaCopy.invitedFriend}</span>\n                      <span dir=\"ltr\">({friend})</span>\n                    </span>\n                  ) : null}\n                  <span className=\"notificationActionMetaItem\">\n""",
          """                <small className=\"notificationActionMeta\">\n                  <span className=\"notificationActionMetaItem\">\n""")
          replace_once(center,
          """                {!receiptViewActive && unreadCount > 0 ? (\n                  <button\n""",
          """                {!receiptViewActive && markAllAvailable ? (\n                  <button\n""")
          replace_once(center,
          """                    onClick={() => {\n                      setReceipt(null);\n                      setReceiptLoading(false);\n""",
          """                    onClick={() => {\n                      receiptRequestRef.current += 1;\n                      setReceipt(null);\n                      setReceiptLoading(false);\n""")
          replace_once(center,
          ".notificationHistoryRow.isRead .notificationHistoryTime,.notificationHistoryRow.isRead .notificationFriendWallet{color:#5e5a55}",
          ".notificationHistoryRow.isRead .notificationHistoryTime{color:#5e5a55}")
          replace_once(center,
          ".notificationFriendWallet{color:#777168;font-size:.55rem;font-weight:800;letter-spacing:.01em;unicode-bidi:isolate}",
          "")

          app = 'src/components/InAppInviteNotifications.tsx'
          replace_once(app,
          """    const unreadThroughSnapshot = items.filter((notification) =>\n      notification.readAt === null &&\n      historyIdAtOrBefore(notification.id, throughId),\n    );\n""",
          """    const unreadThroughSnapshot = items.filter((notification) =>\n      notification.readAt === null &&\n      notification.kind !== 'REWARD_PAID' &&\n      historyIdAtOrBefore(notification.id, throughId),\n    );\n""")
          replace_once(app,
          """          item.readAt === null && historyIdAtOrBefore(item.id, throughId)\n            ? { ...item, readAt: now }\n""",
          """          item.readAt === null &&\n          item.kind !== 'REWARD_PAID' &&\n          historyIdAtOrBefore(item.id, throughId)\n            ? { ...item, readAt: now }\n""")
          replace_once(app,
          """      unreadCount={unreadCount}\n      open={open}\n""",
          """      unreadCount={unreadCount}\n      markAllAvailable={items.some(\n        (item) => item.readAt === null && item.kind !== 'REWARD_PAID',\n      )}\n      open={open}\n""")

          claim = 'src/lib/rewards/rewardClaimClient.ts'
          replace_once(claim,
          """    const response = await fetch('/api/rewards/receipts?limit=50', {\n      cache: 'no-store',\n    });\n""",
          """    const response = await fetch(\n      `/api/rewards/receipts?inviteCode=${encodeURIComponent(inviteCode)}`,\n      { cache: 'no-store' },\n    );\n""")
          replace_once(claim,
          """    const receipts = Array.isArray(body.receipts) ? body.receipts : [];\n    const paid = receipts.find((receipt) =>\n      typeof receipt?.inviteCode === 'string' &&\n      sameInviteCode(receipt.inviteCode, inviteCode),\n    );\n""",
          """    const receipts = Array.isArray(body.receipts) ? body.receipts : [];\n    const paid = receipts[0];\n    if (\n      !paid ||\n      typeof paid.inviteCode !== 'string' ||\n      !sameInviteCode(paid.inviteCode, inviteCode)\n    ) {\n      return { kind: 'UNKNOWN' };\n    }\n""")

          hard = 'src/app/notification-i18n-hardening.css'
          replace_once(hard,
          """/* The bell opens immediately while reward actions are fetched in the\n * background. Do not show a temporary \"Rewards to claim / Please wait\"\n * section when no actionable reward has been confirmed yet. */\n.notificationHistoryRoot .notificationActionSection:has(.notificationActionLoading) {\n  display: none !important;\n}\n\n""",
          "")

          polish = 'src/app/notification-history-polish.css'
          replace_once(polish,
          """  grid-template-areas:\n    \"title time\"\n    \"body body\"\n    \"meta meta\" !important;\n""",
          """  grid-template-areas:\n    \"title time\"\n    \"body body\" !important;\n""")
          replace_once(polish,
          """  text-wrap: balance !important;\n}\n\n.notificationHistoryPanel .notificationHistoryBody {\n""",
          """  text-wrap: balance !important;\n  text-align: start !important;\n}\n\n.notificationHistoryPanel .notificationHistorySrOnly {\n  position: absolute !important;\n  width: 1px !important;\n  height: 1px !important;\n  padding: 0 !important;\n  margin: -1px !important;\n  overflow: hidden !important;\n  clip: rect(0, 0, 0, 0) !important;\n  clip-path: inset(50%) !important;\n  white-space: nowrap !important;\n  border: 0 !important;\n}\n\n.notificationHistoryPanel .notificationHistoryBody {\n""")
          replace_once(polish,
          """  text-wrap: pretty !important;\n}\n\n.notificationHistoryPanel .notificationHistoryMeta {\n  grid-area: meta !important;\n""",
          """  text-wrap: pretty !important;\n  text-align: start !important;\n}\n\n.notificationHistoryPanel .notificationHistoryMeta {\n  grid-column: 1 / -1 !important;\n""")
          # Remove the obsolete standalone friend metadata styling block.
          p = Path(polish)
          text = p.read_text()
          start = text.index('.notificationHistoryPanel .notificationFriendMeta {')
          end = text.index('.notificationHistoryPanel .notificationReceiptAction {', start)
          text = text[:start] + text[end:]
          p.write_text(text)
          replace_once(polish,
          """    grid-template-areas:\n      \"title time\"\n      \"body body\"\n      \"meta meta\" !important;\n""",
          """    grid-template-areas:\n      \"title time\"\n      \"body body\" !important;\n""")

          route = 'src/app/api/notifications/history/route.ts'
          replace_once(route,
          """  try {\n    const acknowledgementResult = await supabaseAdmin.rpc(\n""",
          """  try {\n    if (ids) {\n      const paidResult = await supabaseAdmin\n        .from('invite_notification_history')\n        .select('id')\n        .eq('inviter_wallet', wallet)\n        .in('id', ids)\n        .eq('kind', 'REWARD_PAID')\n        .limit(1);\n\n      if (paidResult.error) {\n        throw new Error(\n          `Paid notification acknowledgement guard failed: ${paidResult.error.message}`,\n        );\n      }\n      if ((paidResult.data ?? []).length > 0) {\n        return noStoreJson(\n          { error: 'Paid reward notifications must be acknowledged from the reward receipt.' },\n          { status: 400 },\n        );\n      }\n    }\n\n    const acknowledgementResult = await supabaseAdmin.rpc(\n""")

          info_test = 'tests/notification-information-hierarchy.test.mjs'
          replace_once(info_test,
          """test('notification cards explain whose wallet is shown instead of exposing an unlabeled address', () => {\n  assert.match(center, /metaCopy\\.invitedFriend/u);\n  assert.match(center, /className=\"notificationFriendMeta\"/u);\n  assert.match(center, /className=\"notificationFriendWallet\" dir=\"ltr\"/u);\n  assert.match(center, /\\(\\{friend\\}\\)/u);\n  assert.match(center, /metaCopy\\.inviteCode/u);\n  assert.match(center, /className=\"notificationActionMetaItem\"/u);\n});\n""",
          """test('ordinary notification cards keep friend context in natural body copy without a detached wallet row', () => {\n  assert.match(center, /className=\"notificationHistoryBody\">\\{copy\\.body\\}<\\/span>/u);\n  assert.match(center, /const showMeta = Boolean\\(copy\\.hint \\|\\| item\\.kind === 'REWARD_PAID'\\)/u);\n  assert.doesNotMatch(center, /notificationFriendMeta/u);\n  assert.doesNotMatch(center, /notificationFriendWallet/u);\n  assert.match(center, /metaCopy\\.inviteCode/u);\n  assert.match(center, /className=\"notificationActionMetaItem\"/u);\n});\n""")
          replace_once(info_test,
          """  assert.match(polish, /\"title time\"[\\s\\S]*\"body body\"[\\s\\S]*\"meta meta\"/u);\n""",
          """  assert.match(polish, /\"title time\"[\\s\\S]*\"body body\"/u);\n  assert.doesNotMatch(polish, /\"meta meta\"/u);\n  assert.match(polish, /\\.notificationHistoryMeta[\\s\\S]*grid-column:\\s*1 \\/ -1\\s*!important/u);\n""")

          polish_test = 'tests/notification-history-polish.test.mjs'
          replace_once(polish_test,
          """  assert.match(polish, /grid-template-areas:[\\s\\S]*\"title time\"[\\s\\S]*\"body body\"[\\s\\S]*\"meta meta\"\\s*!important/u);\n""",
          """  assert.match(polish, /grid-template-areas:[\\s\\S]*\"title time\"[\\s\\S]*\"body body\"\\s*!important/u);\n  assert.doesNotMatch(polish, /\"meta meta\"/u);\n  assert.match(polish, /\\.notificationHistoryMeta[\\s\\S]*grid-column:\\s*1 \\/ -1\\s*!important/u);\n""")
          replace_once(polish_test,
          """  assert.match(polish, /@media \\(max-width:\\s*350px\\)[\\s\\S]*\"title time\"[\\s\\S]*\"body body\"[\\s\\S]*\"meta meta\"/u);\n""",
          """  assert.match(polish, /@media \\(max-width:\\s*350px\\)[\\s\\S]*\"title time\"[\\s\\S]*\"body body\"/u);\n  assert.doesNotMatch(polish, /@media \\(max-width:\\s*350px\\)[\\s\\S]*\"meta meta\"/u);\n""")

          migration = Path('supabase/migrations/20260917000500_preserve_paid_receipt_acknowledgement.sql')
          migration.write_text(r'''-- Keep REWARD_PAID unread until the user acknowledges the rich reward receipt.\n-- Bulk mark-all uses a watermark and must not bypass that acknowledgement path.\n\nbegin;\n\ncreate or replace function public.acknowledge_invite_notification_history(\n  p_inviter_wallet text,\n  p_ids bigint[] default null,\n  p_through_id bigint default null\n)\nreturns jsonb\nlanguage plpgsql\nsecurity definer\nset search_path = pg_catalog, public\nas $$\ndeclare\n  v_wallet text := lower(btrim(p_inviter_wallet));\n  v_row public.invite_notification_history%rowtype;\n  v_count integer := 0;\n  v_stage integer;\nbegin\n  if v_wallet !~ '^0x[0-9a-f]{40}$' then\n    raise exception 'invalid inviter wallet';\n  end if;\n\n  if (p_ids is null and p_through_id is null)\n     or (p_ids is not null and p_through_id is not null) then\n    raise exception 'choose ids or through id';\n  end if;\n\n  if p_ids is not null then\n    if cardinality(p_ids) < 1 or cardinality(p_ids) > 100 then\n      raise exception 'invalid notification id count';\n    end if;\n  elsif p_through_id is null or p_through_id < 1 then\n    raise exception 'invalid through id';\n  end if;\n\n  for v_row in\n    select h.*\n    from public.invite_notification_history h\n    where h.inviter_wallet = v_wallet\n      and (\n        (p_ids is not null and h.id = any(p_ids))\n        or (\n          p_through_id is not null\n          and h.id <= p_through_id\n          and h.kind <> 'REWARD_PAID'\n        )\n      )\n      and not exists (\n        select 1\n        from public.invite_notification_history_reads r\n        where r.notification_id = h.id\n      )\n    order by h.id\n  loop\n    insert into public.invite_notification_history_reads(\n      notification_id,\n      inviter_wallet,\n      read_at\n    ) values (\n      v_row.id,\n      v_wallet,\n      now()\n    )\n    on conflict (notification_id) do nothing;\n\n    if found then\n      v_stage := case\n        when v_row.kind = 'DAPP_PROGRESS'\n          and coalesce(v_row.dapp_progress, 0) < 3\n        then null\n        else v_row.stage\n      end;\n\n      perform public.acknowledge_invite_notification_v2(\n        v_row.invite_code,\n        v_wallet,\n        v_stage,\n        v_row.dapp_progress,\n        v_row.kind = 'REWARD_READY'\n      );\n      v_count := v_count + 1;\n    end if;\n  end loop;\n\n  return jsonb_build_object('acknowledged', v_count);\nend;\n$$;\n\nrevoke all on function public.acknowledge_invite_notification_history(text,bigint[],bigint) from public, anon, authenticated;\ngrant execute on function public.acknowledge_invite_notification_history(text,bigint[],bigint) to service_role;\n\ncommit;\n''')

          manifest = Path('supabase/production-migration-manifest.txt')
          manifest_text = manifest.read_text()
          migration_name = migration.name
          if migration_name not in manifest_text:
              if not manifest_text.endswith('\n'):
                  manifest_text += '\n'
              manifest_text += migration_name + '\n'
              manifest.write_text(manifest_text)

          final_test = Path('tests/notification-final-integrity.test.mjs')
          final_test.write_text(r'''import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { readFileSync } from 'node:fs';\n\nconst read = (path) => readFileSync(path, 'utf8');\nconst center = read('src/components/UnifiedInviteNotificationHistoryCenter.tsx');\nconst controller = read('src/components/InAppInviteNotifications.tsx');\nconst route = read('src/app/api/notifications/history/route.ts');\nconst claimClient = read('src/lib/rewards/rewardClaimClient.ts');\nconst polish = read('src/app/notification-history-polish.css');\nconst hardening = read('src/app/notification-i18n-hardening.css');\nconst migration = read('supabase/migrations/20260917000500_preserve_paid_receipt_acknowledgement.sql');\n\ntest('ordinary cards do not reserve a detached friend-wallet row', () => {\n  assert.doesNotMatch(center, /notificationFriendMeta/u);\n  assert.doesNotMatch(center, /notificationFriendWallet/u);\n  assert.match(center, /const showMeta = Boolean\\(copy\\.hint \\|\\| item\\.kind === 'REWARD_PAID'\\)/u);\n  assert.doesNotMatch(polish, /\"meta meta\"/u);\n  assert.match(polish, /notificationHistorySrOnly[\\s\\S]*clip-path:\\s*inset\\(50%\\)\\s*!important/u);\n});\n\ntest('mark-all preserves unread paid receipts until receipt acknowledgement', () => {\n  assert.match(controller, /notification\\.kind !== 'REWARD_PAID'/u);\n  assert.match(controller, /item\\.kind !== 'REWARD_PAID'/u);\n  assert.match(controller, /markAllAvailable=\\{items\\.some/u);\n  assert.match(route, /Paid reward notifications must be acknowledged from the reward receipt/u);\n  assert.match(migration, /p_through_id is not null[\\s\\S]*h\\.kind <> 'REWARD_PAID'/u);\n});\n\ntest('receipt requests cannot overwrite a newer or dismissed receipt view', () => {\n  assert.match(center, /const receiptRequestRef = useRef\\(0\\)/u);\n  assert.match(center, /const requestId = receiptRequestRef\\.current \\+ 1/u);\n  assert.match(center, /if \\(receiptRequestRef\\.current !== requestId\\) return;/u);\n  assert.match(center, /receiptRequestRef\\.current \\+= 1/u);\n});\n\ntest('receipt authentication failures invalidate the wallet session consistently', () => {\n  const authChecks = center.match(/response\\.status === 401 \\|\\| response\\.status === 403/g) ?? [];\n  assert.ok(authChecks.length >= 3);\n  assert.match(center, /notifyRewardClaimSessionInvalid\\(\\)/u);\n});\n\ntest('ambiguous Claim recovery looks up the exact invite receipt instead of only the latest 50', () => {\n  assert.match(claimClient, /rewards\\/receipts\\?inviteCode=\\$\\{encodeURIComponent\\(inviteCode\\)\\}/u);\n  assert.doesNotMatch(claimClient, /rewards\\/receipts\\?limit=50/u);\n});\n\ntest('reward-action loading is visible instead of being hidden by legacy CSS', () => {\n  assert.doesNotMatch(hardening, /notificationActionSection:has\\(\\.notificationActionLoading\\)/u);\n  assert.match(center, /className=\"notificationActionLoading\"/u);\n});\n''')
          PY
      - name: Run focused regression tests
        run: |
          node --test \
            tests/notification-information-hierarchy.test.mjs \
            tests/notification-history-polish.test.mjs \
            tests/notification-final-integrity.test.mjs \
            tests/notification-reliability-hardening.test.mjs \
            tests/i18n-notification-hardening.test.mjs
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/notification-final-integrity-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finalize notification integrity and layout"
          git push origin HEAD:fix/notification-final-integrity
