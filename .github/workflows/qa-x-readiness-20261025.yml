name: X readiness isolated QA (temporary)

on:
  pull_request:

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://bpppslplhmppxzvdkwxs.supabase.co
  SUPABASE_SECRET_KEY: ci-placeholder-not-a-real-key
  VERCEL_ENV: preview
  VECHAIN_NETWORK: testnet
  NEXT_PUBLIC_NETWORK_TYPE: test

jobs:
  validate-x-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Targeted X readiness and safety regressions
        run: >-
          node --experimental-strip-types --test
          tests/reward-x-promotion-readiness-cadence.test.mjs
          tests/reward-x-promotion-monthly-budget.test.mjs
          tests/reward-reliability-health-watch.test.mjs
          tests/reward-x-promotion-external-runtime-readiness.test.mjs
          tests/reward-x-promotion-payout-cron.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build with non-production environment
        run: npm run build
