name: Temporary tested Zod4 security candidate (staging only)
on:
  push:
    branches:
      - security/zod4-wallet-compat-20261025

permissions:
  contents: write

concurrency:
  group: temporary-zod4-compat-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://bpppslplhmppxzvdkwxs.supabase.co
  SUPABASE_SECRET_KEY: ci-placeholder-not-a-real-key
  VERCEL_ENV: preview
  VECHAIN_NETWORK: testnet
  NEXT_PUBLIC_NETWORK_TYPE: test

jobs:
  stage-validated-patch:
    if: github.repository == 'chrislee0223/veinvite' && github.ref == 'refs/heads/security/zod4-wallet-compat-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout security candidate branch
        uses: actions/checkout@v7
        with:
          ref: security/zod4-wallet-compat-20261025
          persist-credentials: true
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Create strictly scoped patched Zod candidate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          if (pkg.dependencies['@vechain/vechain-kit']!=='2.13.0') throw new Error('WALLET_KIT_VERSION_CHANGED');
          if (pkg.dependencies['@vechain/dapp-kit-react']!=='2.3.3') throw new Error('DAPPKIT_VERSION_CHANGED');
          if (pkg.overrides?.zod && pkg.overrides.zod!=='4.6.6') throw new Error('PREEXISTING_ZOD_OVERRIDE');
          NODE
          npm pkg set overrides.zod=4.6.6
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit
          git diff --check
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          if (pkg.overrides.zod!=='4.6.6' ||
              pkg.dependencies['@vechain/vechain-kit']!=='2.13.0' ||
              pkg.dependencies['@vechain/dapp-kit-react']!=='2.3.3') throw new Error('ROOT_VERSIONS_CHANGED');
          const zod=Object.entries(lock.packages).filter(([p])=>p.endsWith('/zod'));
          if (zod.length===0 || zod.some(([,v])=>v.version!=='4.6.6')) throw new Error('ZOD_OVERRIDE_INCOMPLETE');
          console.log('PATCHED_ZOD_INSTANCES',zod.length);
          NODE
      - name: Security audit MUST pass at High threshold
        run: npm audit --audit-level=high
      - name: Install and execute full regression tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-fund --no-audit
          node --test tests/wallet-*.test.mjs
          node --test tests/security-client-identity-gate.test.mjs tests/security-client-retention-gate.test.mjs
          npm run test:rewards
          npm run test:i18n
          npm run typecheck
          npm run build
      - name: Commit only reviewed dependency manifests to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Already staged candidate, nothing to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --check
          git commit -m 'fix(security): stage patched Zod 4.6.6 override for wallet compatibility review'
          git push origin HEAD:security/zod4-wallet-compat-20261025
