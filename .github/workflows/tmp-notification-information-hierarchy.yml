name: Temporary notification information hierarchy patch

on:
  push:
    branches:
      - polish/notification-information-hierarchy

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: polish/notification-information-hierarchy

      - name: Apply reviewed notification hierarchy patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import base64

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          component = 'src/components/UnifiedInviteNotificationHistoryCenter.tsx'
          replace_once(
              component,
              "import { NOTIFICATION_HISTORY_COPY } from '@/lib/i18n/notificationHistoryCopy';\n",
              "import { NOTIFICATION_HISTORY_COPY } from '@/lib/i18n/notificationHistoryCopy';\nimport { NOTIFICATION_META_COPY } from '@/lib/i18n/notificationMetaCopy';\n",
          )
          replace_once(
              component,
              "  const structure = NOTIFICATION_HISTORY_COPY[supportedLocale];\n  const notificationCopy = NOTIFICATION_COPY[supportedLocale];\n",
              "  const structure = NOTIFICATION_HISTORY_COPY[supportedLocale];\n  const metaCopy = NOTIFICATION_META_COPY[supportedLocale];\n  const notificationCopy = NOTIFICATION_COPY[supportedLocale];\n",
          )
          replace_once(component, "                  {structure.newLabel}\n", "                  {metaCopy.unread}\n")
          replace_once(
              component,
              "          {friend ? (\n            <span className=\"notificationFriendWallet\" dir=\"ltr\">\n              {friend}\n            </span>\n          ) : null}\n          {copy.hint ? <b>{copy.hint}</b> : null}\n          {item.kind === 'REWARD_PAID' ? (\n            <em aria-hidden=\"true\">›</em>\n          ) : null}\n",
              "          {friend ? (\n            <span className=\"notificationFriendMeta\">\n              <span className=\"notificationFriendLabel\">\n                {metaCopy.invitedFriend}\n              </span>\n              <span className=\"notificationFriendWallet\" dir=\"ltr\">\n                ({friend})\n              </span>\n            </span>\n          ) : null}\n          {copy.hint ? <b>{copy.hint}</b> : null}\n          {item.kind === 'REWARD_PAID' ? (\n            <span className=\"notificationReceiptAction\">\n              <span>{metaCopy.viewReceipt}</span>\n              <em aria-hidden=\"true\">›</em>\n            </span>\n          ) : null}\n",
          )
          replace_once(
              component,
              "                <small dir=\"ltr\">\n                  {friend ? `${friend} · ` : ''}{action.inviteCode}\n                </small>\n",
              "                <small className=\"notificationActionMeta\">\n                  {friend ? (\n                    <span className=\"notificationActionMetaItem\">\n                      <span>{metaCopy.invitedFriend}</span>\n                      <span dir=\"ltr\">({friend})</span>\n                    </span>\n                  ) : null}\n                  <span className=\"notificationActionMetaItem\">\n                    <span>{metaCopy.inviteCode}</span>\n                    <span dir=\"ltr\">({action.inviteCode})</span>\n                  </span>\n                </small>\n",
          )
          replace_once(
              component,
              "                  <span>{structure.newLabel} · {unreadCount}</span>\n",
              "                  <span>{metaCopy.unread} · {unreadCount}</span>\n",
          )

          history = Path('src/lib/i18n/notificationHistoryCopy.ts')
          history_text = history.read_text()
          old_ko = "ko: { title: '알림', newLabel: '새 알림', markAll: '모두 읽음', today: '오늘', yesterday: '어제', earlier: '이전 알림'"
          new_ko = "ko: { title: '알림', newLabel: '읽지 않음', markAll: '모두 읽음 처리', today: '오늘', yesterday: '어제', earlier: '이전'"
          if history_text.count(old_ko) != 1:
              raise SystemExit('notificationHistoryCopy.ts: Korean chrome signature changed')
          history.write_text(history_text.replace(old_ko, new_ko, 1))

          meta_b64 = ''
          hierarchy_test_b64 = ''
          polish_test_b64 = ''
          Path('src/lib/i18n/notificationMetaCopy.ts').write_bytes(base64.b64decode(meta_b64))
          Path('tests/notification-information-hierarchy.test.mjs').write_bytes(base64.b64decode(hierarchy_test_b64))
          Path('tests/notification-history-polish.test.mjs').write_bytes(base64.b64decode(polish_test_b64))

          css = Path('src/app/notification-history-polish.css')
          css_text = css.read_text()
          old_grid = "  grid-template-columns: minmax(0, 1fr) auto !important;\n  grid-template-areas:\n    \"title title\"\n    \"body body\"\n    \"meta time\" !important;"
          new_grid = "  grid-template-columns: minmax(0, 1fr) max-content !important;\n  grid-template-areas:\n    \"title time\"\n    \"body body\"\n    \"meta meta\" !important;"
          if css_text.count(old_grid) != 1:
              raise SystemExit('notification-history-polish.css: main grid signature changed')
          css_text = css_text.replace(old_grid, new_grid, 1)
          old_comment = "/* Flatten the old top row so time can live with metadata instead of fighting\n * long translated titles for horizontal space. */"
          new_comment = "/* Flatten the top row so title and event time share a stable first line while\n * body and relationship metadata keep their own full-width rows. */"
          if css_text.count(old_comment) != 1:
              raise SystemExit('notification-history-polish.css: top-row comment signature changed')
          css_text = css_text.replace(old_comment, new_comment, 1)
          title_wrap_old = "  hyphens: auto !important;\n}\n\n.notificationHistoryPanel .notificationHistoryBody {"
          title_wrap_new = "  hyphens: auto !important;\n  text-wrap: balance !important;\n}\n\n.notificationHistoryPanel .notificationHistoryBody {"
          if css_text.count(title_wrap_old) != 1:
              raise SystemExit('notification-history-polish.css: title wrap signature changed')
          css_text = css_text.replace(title_wrap_old, title_wrap_new, 1)
          body_wrap_old = "  hyphens: auto !important;\n}\n\n.notificationHistoryPanel .notificationHistoryMeta {"
          body_wrap_new = "  hyphens: auto !important;\n  text-wrap: pretty !important;\n}\n\n.notificationHistoryPanel .notificationHistoryMeta {"
          if css_text.count(body_wrap_old) != 1:
              raise SystemExit('notification-history-polish.css: body wrap signature changed')
          css_text = css_text.replace(body_wrap_old, body_wrap_new, 1)
          wallet_old = ".notificationHistoryPanel .notificationFriendWallet {\n  max-width: 100% !important;\n  color: #837d74 !important;\n  font-size: 0.57rem !important;\n  line-height: 1.3 !important;\n  overflow: hidden !important;\n  text-overflow: ellipsis !important;\n  white-space: nowrap !important;\n}\n"
          wallet_new = ".notificationHistoryPanel .notificationFriendMeta {\n  min-width: 0 !important;\n  max-width: 100% !important;\n  display: inline-flex !important;\n  align-items: baseline !important;\n  flex-wrap: wrap !important;\n  gap: 4px !important;\n  color: #837d74 !important;\n  font-size: 0.57rem !important;\n  line-height: 1.35 !important;\n}\n\n.notificationHistoryPanel .notificationFriendLabel {\n  overflow-wrap: anywhere !important;\n}\n\n.notificationHistoryPanel .notificationFriendWallet {\n  max-width: 100% !important;\n  color: #918a80 !important;\n  font: inherit !important;\n  overflow: hidden !important;\n  text-overflow: ellipsis !important;\n  white-space: nowrap !important;\n}\n\n.notificationHistoryPanel .notificationReceiptAction {\n  display: inline-flex !important;\n  align-items: center !important;\n  gap: 4px !important;\n  color: #b9a76f !important;\n  font-size: 0.57rem !important;\n  line-height: 1.3 !important;\n  white-space: nowrap !important;\n}\n"
          if css_text.count(wallet_old) != 1:
              raise SystemExit('notification-history-polish.css: wallet style signature changed')
          css_text = css_text.replace(wallet_old, wallet_new, 1)
          action_old = ".notificationHistoryPanel .notificationActionCopy small {\n  max-width: 100% !important;\n  font-size: 0.56rem !important;\n  line-height: 1.3 !important;\n}\n"
          action_new = ".notificationHistoryPanel .notificationActionCopy small {\n  max-width: 100% !important;\n  font-size: 0.56rem !important;\n  line-height: 1.35 !important;\n}\n\n.notificationHistoryPanel .notificationActionMeta {\n  display: flex !important;\n  flex-wrap: wrap !important;\n  gap: 5px 9px !important;\n  color: #837d74 !important;\n}\n\n.notificationHistoryPanel .notificationActionMetaItem {\n  min-width: 0 !important;\n  display: inline-flex !important;\n  align-items: baseline !important;\n  flex-wrap: wrap !important;\n  gap: 4px !important;\n}\n\n.notificationHistoryPanel .notificationActionMetaItem > span:last-child {\n  color: #918a80 !important;\n  white-space: nowrap !important;\n}\n"
          if css_text.count(action_old) != 1:
              raise SystemExit('notification-history-polish.css: action meta signature changed')
          css_text = css_text.replace(action_old, action_new, 1)
          narrow_old = "  .notificationHistoryPanel .notificationHistoryContent {\n    grid-template-columns: minmax(0, 1fr) !important;\n    grid-template-areas:\n      \"title\"\n      \"body\"\n      \"meta\"\n      \"time\" !important;\n  }\n\n  .notificationHistoryPanel .notificationHistoryTime {\n    justify-self: start !important;\n  }\n"
          narrow_new = "  .notificationHistoryPanel .notificationHistoryContent {\n    grid-template-columns: minmax(0, 1fr) max-content !important;\n    grid-template-areas:\n      \"title time\"\n      \"body body\"\n      \"meta meta\" !important;\n    column-gap: 8px !important;\n  }\n"
          if css_text.count(narrow_old) != 1:
              raise SystemExit('notification-history-polish.css: narrow layout signature changed')
          css_text = css_text.replace(narrow_old, narrow_new, 1)
          korean_wrap = "\n\n/* Korean copy should prefer natural phrase boundaries. `pretty` wrapping keeps\n * a final short word from being stranded on its own line in modern browsers,\n * while keep-all remains the safe fallback for older engines. */\n.notificationHistoryPanel[lang=\"ko\"] .notificationHistoryTitle,\n.notificationHistoryPanel[lang=\"ko\"] .notificationHistoryBody {\n  word-break: keep-all !important;\n  overflow-wrap: normal !important;\n  hyphens: none !important;\n}\n"
          css.write_text(css_text + korean_wrap)
          PY

      - name: Run focused notification regression tests
        run: >-
          node --test
          tests/notification-history-polish.test.mjs
          tests/notification-information-hierarchy.test.mjs
          tests/i18n-notification-history-production.test.mjs
          tests/i18n-notification-reward-center.test.mjs
          tests/notification-history-fast-open.test.mjs

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-notification-information-hierarchy.yml
          git add src/components/UnifiedInviteNotificationHistoryCenter.tsx \
                  src/app/notification-history-polish.css \
                  src/lib/i18n/notificationHistoryCopy.ts \
                  src/lib/i18n/notificationMetaCopy.ts \
                  tests/notification-history-polish.test.mjs \
                  tests/notification-information-hierarchy.test.mjs
          git commit -m "Polish notification information hierarchy"
          git push origin HEAD:polish/notification-information-hierarchy
