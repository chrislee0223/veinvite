name: One-shot referral refresh patch

on:
  push:
    branches:
      - fix/referral-link-instant-refresh-20260904

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/referral-link-instant-refresh-20260904

      - name: Apply reviewed patch
        run: python scripts/one-shot-referral-refresh-patch.py

      - name: Validate patch shape
        run: |
          git diff --check
          node --test tests/referral-link-refresh-cache.test.mjs

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/HomeClient.tsx tests/referral-link-refresh-cache.test.mjs .github/workflows/ci.yml
          git commit -m "Restore permanent referral link instantly on refresh"
          git push origin HEAD:fix/referral-link-instant-refresh-20260904
