name: Temporary security lock refresh

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.head_ref == 'fix/og-png-logo-rendering'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Refresh lockfile security fixes
        run: npm audit fix --package-lock-only --ignore-scripts || true

      - name: Verify no high or critical audit findings
        run: npm audit --audit-level=high

      - name: Commit refreshed lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Refresh lockfile security fixes'
          git push origin HEAD:${{ github.head_ref }}
