name: Reward Shadow QA

# Independent read-only arithmetic tests; DOES NOT bypass required Security CI.
on:
  pull_request:
    paths:
      - 'src/lib/rewards/rewardAdmissionShadow.ts'
      - 'src/lib/rewards/rewardTreasuryAudit.ts'
      - 'src/lib/rewards/rewardElasticClosureShadow.ts'
      - 'tests/reward-admission-shadow.test.mjs'
      - 'tests/reward-admission-live-compat-boundary.test.mjs'
      - 'tests/reward-treasury-audit.test.mjs'
      - 'tests/reward-elastic-closure-shadow.test.mjs'
      - '.github/workflows/reward-shadow-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-shadow-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute pure reward shadow tests (no database, npm or network)
        run: |
          node --experimental-strip-types --test \
            tests/reward-admission-shadow.test.mjs \
            tests/reward-admission-live-compat-boundary.test.mjs \
            tests/reward-treasury-audit.test.mjs \
            tests/reward-elastic-closure-shadow.test.mjs
