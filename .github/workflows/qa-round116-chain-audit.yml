name: QA Round116 Chain Audit

on:
  push:
    branches:
      - qa-round116-chain-audit
    paths:
      - '.github/workflows/qa-round116-chain-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Compare historical RewardDistributed appIds
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { ABIEvent } from '@vechain/sdk-core';
          import { ThorClient } from '@vechain/sdk-network';

          const thor = ThorClient.at('https://mainnet.vechain.org');
          const pool = '0x6Bee7DDab6c99d5B2Af0554EaEA484CE18F52631';
          const ev = new ABIEvent(
            'event RewardDistributed(uint256 amount, bytes32 indexed appId, address indexed receiver, string proof, address indexed distributor)',
          );

          const cases = {
            '74FQ6CB':['0x2d415cbf574177ccf0e8a178ef2c8df1dcdfa2cc',25825343],
            'F84ZL4N':['0xd2fe919a38fb7ab6f2c2df0fec7723cb778b0989',25831197],
            'SQCX6F9':['0x352ac255f820a9d5b952b52199f06f664b40ce15',25832252],
            'V34W9PM':['0xbe38eb6be67e52c2743995a7bf59efd0e9265d5d',25833219],
            '8GANYW6':['0x703210579b9f2fd2317415278af71f5fc59f6cc8',25834196],
            'WPGLEGJ':['0x54f7d0b2f2cdc9be9d1be04c7101e984f2934c36',25834269],
            'BGGJDJS':['0x37f983771b32d94e975e2568e5dca21d43d75a4d',25834638],
            '8DNK7KV':['0x1bbd28f95af0df8edcf73431cab62af3b8807c39',25840115],
            '9L4TMG5':['0x97e82cc272aaa9745b06525085f37b64e2382ff8',25840751],
            'SBWYUFQ':['0x95af037750d985f094969d3cd741a0ff51082cba',25842235],
          };

          const all = new Map();
          const blockMembers = new Map();

          for (const [code,[wallet,activation]] of Object.entries(cases)) {
            const topics = ev.encodeFilterTopics([null,wallet,null]);
            const rows = [];
            let offset=0;
            while (true) {
              const logs = await thor.logs.filterRawEventLogs({
                range:{unit:'block',from:0,to:activation-1},
                options:{offset,limit:1000},
                criteriaSet:[{
                  address:pool,
                  topic0: typeof topics[0] === 'string' ? topics[0] : undefined,
                  topic1: typeof topics[1] === 'string' ? topics[1] : undefined,
                  topic2: typeof topics[2] === 'string' ? topics[2] : undefined,
                  topic3: typeof topics[3] === 'string' ? topics[3] : undefined,
                }],
                order:'asc',
              });
              for (const log of logs) {
                const appId=log.topics?.[1]?.toLowerCase();
                if (!appId) continue;
                const row={
                  app_id:appId,
                  block:log.meta?.blockNumber ?? null,
                  timestamp:log.meta?.blockTimestamp ?? null,
                  tx:log.meta?.txID ?? null,
                };
                rows.push(row);
                if (Number.isInteger(row.block)) {
                  if (!blockMembers.has(row.block)) blockMembers.set(row.block,[]);
                  blockMembers.get(row.block).push([code,appId]);
                }
              }
              if (logs.length < 1000) break;
              offset += 1000;
            }
            all.set(code,rows);
            const counts={};
            for(const r of rows) counts[r.app_id]=(counts[r.app_id]??0)+1;
            console.log('HIST_ROW '+JSON.stringify({
              invite_code:code,wallet,reward_count:rows.length,
              unique_apps:Object.keys(counts).length,
              app_counts:Object.entries(counts),
              rewards:rows,
            }));
          }

          const seqGroups=new Map();
          for(const [code,rows] of all){
            const sig=JSON.stringify(rows.map(r=>r.app_id));
            if(!seqGroups.has(sig)) seqGroups.set(sig,[]);
            seqGroups.get(sig).push(code);
          }
          console.log('SEQUENCE_GROUPS '+JSON.stringify(
            [...seqGroups.entries()].map(([sig,codes])=>({
              wallet_count:codes.length,codes,sequence:JSON.parse(sig)
            }))
          ));

          const sync=[];
          for(const [block,members] of blockMembers){
            const codes=[...new Set(members.map(x=>x[0]))].sort();
            if(codes.length<2) continue;
            sync.push({
              block,wallet_count:codes.length,codes,
              app_ids:[...new Set(members.map(x=>x[1]))].sort()
            });
          }
          sync.sort((a,b)=>a.block-b.block);
          console.log('SYNC_BLOCKS '+JSON.stringify(sync));
          JS
