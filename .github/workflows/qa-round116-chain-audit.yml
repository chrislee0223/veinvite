name: QA Round116 Chain Audit

on:
  push:
    branches:
      - qa-round116-chain-audit
    paths:
      - '.github/workflows/qa-round116-chain-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trace Round 116 inviter funding graph
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request

          NODE='https://mainnet.vechain.org'
          VTHO='0x0000000000000000000000000000456e65726779'
          TRANSFER='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'
          TO_BLOCK=25890000
          inviters=[
            '0x0533410815b0bb452362f91c6c9d1d64abf2c295',
            '0x5ea9700efcfded17b7521186efc42e830501cb77',
            '0xb7ce84c0c7fc87f64aa66399f65e3968062e1a2f',
            '0x072f34d9e0f6535d5b25dcd722d85f13c50a4bc9',
            '0x50db275162ce11662bea1f0d31eac1d7e33f565e',
            '0x44f4665888f41e3b72db40e36fa06e62afc06ca5',
            '0x377a18e24d64e0340f4e1a4b62a295f45b317cef',
            '0xcb15dd2dbcd19d5e481d10d0edc657c2ce7f3909',
            '0xbc147a036c266300c3c4fc20ca7886ada9a4b7ae',
          ]
          inviter_set=set(x.lower() for x in inviters)

          def post(path, body):
            req=urllib.request.Request(
              NODE+path,
              data=json.dumps(body).encode(),
              headers={'content-type':'application/json'},
              method='POST'
            )
            with urllib.request.urlopen(req,timeout=30) as r:
              return json.loads(r.read().decode())

          def topic(addr):
            return '0x'+'0'*24+addr.lower().replace('0x','')

          def parse_vtho(e):
            topics=e.get('topics') or []
            sender='0x'+topics[1][-40:].lower() if len(topics)>=3 else None
            recipient='0x'+topics[2][-40:].lower() if len(topics)>=3 else None
            m=e.get('meta') or {}
            data=e.get('data')
            amount=None
            if isinstance(data,str) and data.startswith('0x'):
              try: amount=str(int(data,16))
              except: pass
            return {'sender':sender,'recipient':recipient,'block':m.get('blockNumber'),'tx':m.get('txID'),'amount_wei':amount}

          def parse_vet(e):
            m=e.get('meta') or {}
            return {'sender':e.get('sender'),'recipient':e.get('recipient'),'block':m.get('blockNumber'),'tx':m.get('txID'),'amount_wei':e.get('amount')}

          for wallet in inviters:
            common={'range':{'unit':'block','from':0,'to':TO_BLOCK},'options':{'offset':0,'limit':10},'order':'asc'}
            vin=post('/logs/transfer',{**common,'criteriaSet':[{'recipient':wallet}]})
            hin=post('/logs/event',{**common,'criteriaSet':[{'address':VTHO,'topic0':TRANSFER,'topic2':topic(wallet)}]})
            vout=post('/logs/event',{**common,'criteriaSet':[{'address':VTHO,'topic0':TRANSFER,'topic1':topic(wallet)}]})
            row={
              'wallet':wallet,
              'vet_in':[parse_vet(x) for x in vin[:10]],
              'vtho_in':[parse_vtho(x) for x in hin[:10]],
              'vtho_out':[parse_vtho(x) for x in vout[:10]],
            }
            print('INVITER_ROW '+json.dumps(row,separators=(',',':')))
            for e in row['vtho_in']:
              if e['sender'] in inviter_set:
                print('INVITER_LINK '+json.dumps({'from':e['sender'],'to':wallet,'block':e['block'],'amount_wei':e['amount_wei'],'tx':e['tx']},separators=(',',':')))
          PY
