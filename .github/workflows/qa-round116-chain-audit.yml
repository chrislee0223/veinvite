name: QA Round116 Chain Audit

on:
  push:
    branches:
      - qa-round116-chain-audit
    paths:
      - '.github/workflows/qa-round116-chain-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare historical dApp rewards for the ten linked wallets
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from collections import Counter, defaultdict

          NODE='https://mainnet.vechain.org'
          POOL='0x6bee7ddab6c99d5b2af0554eaea484ce18f52631'
          B3TR='0x5ef79995fe8a89e0812330e4378eb2660cede699'
          TRANSFER='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'
          cases={
            '74FQ6CB':('0x2d415cbf574177ccf0e8a178ef2c8df1dcdfa2cc',25825343),
            'F84ZL4N':('0xd2fe919a38fb7ab6f2c2df0fec7723cb778b0989',25831197),
            'SQCX6F9':('0x352ac255f820a9d5b952b52199f06f664b40ce15',25832252),
            'V34W9PM':('0xbe38eb6be67e52c2743995a7bf59efd0e9265d5d',25833219),
            '8GANYW6':('0x703210579b9f2fd2317415278af71f5fc59f6cc8',25834196),
            'WPGLEGJ':('0x54f7d0b2f2cdc9be9d1be04c7101e984f2934c36',25834269),
            'BGGJDJS':('0x37f983771b32d94e975e2568e5dca21d43d75a4d',25834638),
            '8DNK7KV':('0x1bbd28f95af0df8edcf73431cab62af3b8807c39',25840115),
            '9L4TMG5':('0x97e82cc272aaa9745b06525085f37b64e2382ff8',25840751),
            'SBWYUFQ':('0x95af037750d985f094969d3cd741a0ff51082cba',25842235),
          }

          def post(path,body):
            req=urllib.request.Request(
              NODE+path,
              data=json.dumps(body).encode(),
              headers={'content-type':'application/json'},
              method='POST'
            )
            with urllib.request.urlopen(req,timeout=30) as r:
              return json.loads(r.read().decode())

          def topic(addr):
            return '0x'+'0'*24+addr.lower().replace('0x','')

          allrows={}
          for code,(wallet,activation) in cases.items():
            body={
              'criteriaSet':[{'address':POOL,'topic2':topic(wallet)}],
              'range':{'unit':'block','from':0,'to':activation-1},
              'options':{'offset':0,'limit':1000},
              'order':'asc'
            }
            logs=post('/logs/event',body)

            # Cross-check only txs that also transferred B3TR from rewards pool to this wallet.
            tlogs=post('/logs/event',{
              'criteriaSet':[{'address':B3TR,'topic0':TRANSFER,'topic1':topic(POOL),'topic2':topic(wallet)}],
              'range':{'unit':'block','from':0,'to':activation-1},
              'options':{'offset':0,'limit':1000},
              'order':'asc'
            })
            transfer_txs={(x.get('meta') or {}).get('txID') for x in tlogs}

            rows=[]
            for e in logs:
              m=e.get('meta') or {}
              topics=e.get('topics') or []
              tx=m.get('txID')
              if tx not in transfer_txs or len(topics)<3:
                continue
              data=(e.get('data') or '').replace('0x','')
              amount=None
              if len(data)>=64:
                try: amount=int(data[:64],16)
                except: pass
              rows.append({
                'app_id':topics[1].lower(),
                'block':m.get('blockNumber'),
                'timestamp':m.get('blockTimestamp'),
                'tx':tx,
                'amount_wei':str(amount) if amount is not None else None,
              })

            allrows[code]=rows
            print('HIST_ROW '+json.dumps({
              'invite_code':code,
              'wallet':wallet,
              'reward_count':len(rows),
              'unique_apps':len(set(r['app_id'] for r in rows)),
              'app_counts':Counter(r['app_id'] for r in rows).most_common(),
              'rewards':rows[:100],
            },separators=(',',':')))

          # Compare exact reward app sequences and synchronized reward blocks.
          signature_groups=defaultdict(list)
          for code,rows in allrows.items():
            sig=tuple(r['app_id'] for r in rows)
            signature_groups[sig].append(code)
          print('SEQUENCE_GROUPS '+json.dumps([
            {'wallet_count':len(codes),'codes':codes,'sequence':list(sig)}
            for sig,codes in signature_groups.items()
          ],separators=(',',':')))

          block_members=defaultdict(list)
          for code,rows in allrows.items():
            for r in rows:
              block_members[r['block']].append((code,r['app_id']))
          synchronized=[]
          for block,members in block_members.items():
            codes=sorted(set(x[0] for x in members))
            if len(codes)>=2:
              synchronized.append({
                'block':block,
                'wallet_count':len(codes),
                'codes':codes,
                'app_ids':sorted(set(x[1] for x in members)),
              })
          synchronized.sort(key=lambda x:(x['block']))
          print('SYNC_BLOCKS '+json.dumps(synchronized,separators=(',',':')))
          PY
