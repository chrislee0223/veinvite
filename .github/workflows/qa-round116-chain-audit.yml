name: QA Round116 Chain Audit

on:
  push:
    branches:
      - qa-round116-chain-audit
    paths:
      - '.github/workflows/qa-round116-chain-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect only post-completion residual activity
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from datetime import datetime, timezone

          NODE='https://mainnet.vechain.org'
          TRANSFER='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'
          cases={
            '8GANYW6':('0x703210579b9f2fd2317415278af71f5fc59f6cc8',25884699),
            '65242BC':('0x259a1644d0c97a823ca1d6d811f6e6b522d92e82',25895132),
            'JEZP37F':('0x009c2dbbb4b823b0544c3580921b544baf77cb4d',25940316),
          }

          def get(path):
            with urllib.request.urlopen(NODE+path,timeout=30) as r:
              return json.loads(r.read().decode())

          def post(path,body):
            req=urllib.request.Request(NODE+path,data=json.dumps(body).encode(),headers={'content-type':'application/json'},method='POST')
            with urllib.request.urlopen(req,timeout=30) as r:
              return json.loads(r.read().decode())

          def topic(addr): return '0x'+'0'*24+addr.lower().replace('0x','')
          def addr(v): return '0x'+v[-40:].lower() if isinstance(v,str) and len(v)>=42 else None

          best=get('/blocks/best')['number']
          for code,(wallet,start) in cases.items():
            base={'range':{'unit':'block','from':start+1,'to':best},'options':{'offset':0,'limit':1000},'order':'asc'}
            inc=post('/logs/event',{**base,'criteriaSet':[{'topic0':TRANSFER,'topic2':topic(wallet)}]})
            out=post('/logs/event',{**base,'criteriaSet':[{'topic0':TRANSFER,'topic1':topic(wallet)}]})
            rows=[]
            for direction,logs in [('in',inc),('out',out)]:
              for e in logs:
                ts=e.get('topics') or []
                m=e.get('meta') or {}
                stamp=m.get('blockTimestamp')
                rows.append({
                  'direction':direction,
                  'contract':(e.get('address') or '').lower(),
                  'from':addr(ts[1]) if len(ts)>=3 else None,
                  'to':addr(ts[2]) if len(ts)>=3 else None,
                  'block':m.get('blockNumber'),
                  'utc':datetime.fromtimestamp(stamp,tz=timezone.utc).isoformat() if isinstance(stamp,int) else None,
                  'tx':m.get('txID'),
                  'data':e.get('data')
                })
            rows.sort(key=lambda x:((x['block'] or 0),x['direction']))
            print('DETAIL '+json.dumps({'invite_code':code,'wallet':wallet,'events':rows},separators=(',',':')))
          PY
