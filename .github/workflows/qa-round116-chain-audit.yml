name: QA Round116 Chain Audit

on:
  push:
    branches:
      - qa-round116-chain-audit
    paths:
      - '.github/workflows/qa-round116-chain-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query VeChain mainnet funding sources
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from collections import Counter

          NODE='https://mainnet.vechain.org'
          VTHO='0x0000000000000000000000000000456e65726779'
          TRANSFER='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'
          BLOCKS_24H=8640
          cases={
            '74FQ6CB':('0x2d415cbf574177ccf0e8a178ef2c8df1dcdfa2cc',25825343),
            'F84ZL4N':('0xd2fe919a38fb7ab6f2c2df0fec7723cb778b0989',25831197),
            'SQCX6F9':('0x352ac255f820a9d5b952b52199f06f664b40ce15',25832252),
            'V34W9PM':('0xbe38eb6be67e52c2743995a7bf59efd0e9265d5d',25833219),
            '8GANYW6':('0x703210579b9f2fd2317415278af71f5fc59f6cc8',25834196),
            'WPGLEGJ':('0x54f7d0b2f2cdc9be9d1be04c7101e984f2934c36',25834269),
            'BGGJDJS':('0x37f983771b32d94e975e2568e5dca21d43d75a4d',25834638),
            '8DNK7KV':('0x1bbd28f95af0df8edcf73431cab62af3b8807c39',25840115),
            '9L4TMG5':('0x97e82cc272aaa9745b06525085f37b64e2382ff8',25840751),
            'SBWYUFQ':('0x95af037750d985f094969d3cd741a0ff51082cba',25842235),
            '7ACQA43':('0x79f1fa450b50a0e7ad5c7255ea8a59eb12e12c3e',25842288),
            '2YYCS2X':('0x9fc31513746887e0d82f50aa41212913848feaa0',25875077),
            'JEZP37F':('0x009c2dbbb4b823b0544c3580921b544baf77cb4d',25878913),
            '65242BC':('0x259a1644d0c97a823ca1d6d811f6e6b522d92e82',25880600),
          }

          def post(path, body):
            req=urllib.request.Request(
              NODE+path,
              data=json.dumps(body).encode(),
              headers={'content-type':'application/json'},
              method='POST'
            )
            with urllib.request.urlopen(req,timeout=30) as r:
              return json.loads(r.read().decode())

          def topic(addr):
            return '0x' + '0'*24 + addr.lower().replace('0x','')

          def parse_vtho(e):
            topics=e.get('topics') or []
            sender='0x'+topics[1][-40:].lower() if len(topics)>=3 else None
            data=e.get('data')
            amount=None
            if isinstance(data,str) and data.startswith('0x'):
              try: amount=str(int(data,16))
              except: pass
            m=e.get('meta') or {}
            return {
              'sender':sender,
              'block':m.get('blockNumber'),
              'tx':m.get('txID'),
              'amount_wei':amount,
            }

          def parse_vet(e):
            m=e.get('meta') or {}
            return {
              'sender':e.get('sender'),
              'block':m.get('blockNumber'),
              'tx':m.get('txID'),
              'amount_wei':e.get('amount'),
            }

          rows=[]
          for code,(wallet,activation) in cases.items():
            end=activation+BLOCKS_24H
            common={'range':{'unit':'block','from':0,'to':end},'options':{'offset':0,'limit':5},'order':'asc'}
            vets=post('/logs/transfer',{**common,'criteriaSet':[{'recipient':wallet}]})
            vthos=post('/logs/event',{**common,'criteriaSet':[{'address':VTHO,'topic0':TRANSFER,'topic2':topic(wallet)}]})
            row={
              'invite_code':code,
              'wallet':wallet.lower(),
              'activation_block':activation,
              'scan_to_block':end,
              'vet_in':[parse_vet(x) for x in vets[:5]],
              'vtho_in':[parse_vtho(x) for x in vthos[:5]],
            }
            rows.append(row)
            print('AUDIT_ROW '+json.dumps(row,separators=(',',':')))

          first_vtho=[r['vtho_in'][0]['sender'] for r in rows if r['vtho_in'] and r['vtho_in'][0]['sender']]
          first_vet=[r['vet_in'][0]['sender'] for r in rows if r['vet_in'] and r['vet_in'][0]['sender']]
          print('VTHO_FUNDER_COUNTS '+json.dumps(Counter(first_vtho),separators=(',',':')))
          print('VET_FUNDER_COUNTS '+json.dumps(Counter(first_vet),separators=(',',':')))
          print('AUDIT_ALL '+json.dumps(rows,separators=(',',':')))
          PY
