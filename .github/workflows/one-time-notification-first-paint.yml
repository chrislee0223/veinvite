name: One-time notification first-paint fix

on:
  push:
    branches:
      - fix/notification-empty-state-first-paint

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply notification first-paint patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/UnifiedInviteNotificationHistoryCenter.tsx')
          source = path.read_text()

          old_guard = """  const renderRewardActions = () => {\n    if (rewardActions.length === 0 && !actionLoading && !actionError) {\n      return null;\n    }\n"""
          new_guard = """  const renderRewardActions = () => {\n    if (rewardActions.length === 0) {\n      return null;\n    }\n"""

          old_empty = ") : sorted.length === 0 && rewardActions.length === 0 && !actionLoading ? ("
          new_empty = ") : sorted.length === 0 && rewardActions.length === 0 ? ("

          if old_guard not in source:
              raise SystemExit('reward-action render guard not found')
          if old_empty not in source:
              raise SystemExit('empty-state loading guard not found')

          source = source.replace(old_guard, new_guard, 1)
          source = source.replace(old_empty, new_empty, 1)
          path.write_text(source)
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-notification-first-paint.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/UnifiedInviteNotificationHistoryCenter.tsx .github/workflows/one-time-notification-first-paint.yml
          git commit -m "Fix notification empty-state first paint"
          git push