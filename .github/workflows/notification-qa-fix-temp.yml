name: Temporary notification QA parity patch

on:
  push:
    branches:
      - fix/notification-final-integrity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notification-final-integrity
          fetch-depth: 0
      - name: Patch QA notification parity
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/qa/QaNotificationStateHarness.tsx')
          text = path.read_text()
          old = """        unreadCount={unreadCount}\n        open={open}\n"""
          new = """        unreadCount={unreadCount}\n        markAllAvailable={items.some(\n          (item) => item.readAt === null && item.kind !== 'REWARD_PAID',\n        )}\n        open={open}\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected markAll prop insertion point once, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = """        onMarkAll={() => {\n          const now = new Date().toISOString();\n          setItems((current) =>\n            current.map((item) => ({\n              ...item,\n              readAt: item.readAt ?? now,\n            })),\n          );\n          setUnreadCount(0);\n        }}\n"""
          new = """        onMarkAll={() => {\n          const now = new Date().toISOString();\n          const markableCount = items.filter(\n            (item) => item.readAt === null && item.kind !== 'REWARD_PAID',\n          ).length;\n          setItems((current) =>\n            current.map((item) =>\n              item.readAt === null && item.kind !== 'REWARD_PAID'\n                ? { ...item, readAt: now }\n                : item,\n            ),\n          );\n          setUnreadCount((current) => Math.max(0, current - markableCount));\n        }}\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected mark-all QA block once, found {text.count(old)}')
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/qa/QaNotificationStateHarness.tsx
          git commit -m "Align notification QA mark-all behavior"
          git push origin HEAD:fix/notification-final-integrity
