name: Execute final notification integrity patch

on:
  push:
    branches:
      - fix/notification-final-integrity

permissions:
  contents: write

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notification-final-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply vetted patch script
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/notification-final-integrity-temp.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n      - name: Run focused regression tests"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, '<notification-integrity-patch>', 'exec'))

          for filename in (
              'supabase/migrations/20260917000500_preserve_paid_receipt_acknowledgement.sql',
              'tests/notification-final-integrity.test.mjs',
          ):
              path = Path(filename)
              path.write_text(path.read_text().replace('\\n', '\n'))
          PY
      - name: Run focused regression tests
        run: |
          node --test \
            tests/notification-information-hierarchy.test.mjs \
            tests/notification-history-polish.test.mjs \
            tests/notification-final-integrity.test.mjs \
            tests/notification-reliability-hardening.test.mjs \
            tests/i18n-notification-hardening.test.mjs
      - name: Commit code changes only
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests supabase
          git commit -m "Finalize notification integrity and layout"
          git push origin HEAD:fix/notification-final-integrity
