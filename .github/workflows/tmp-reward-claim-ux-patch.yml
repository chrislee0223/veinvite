name: Temporary reward claim UX patch

on:
  push:
    branches:
      - fix/reward-claim-status-ux-20260915

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply guarded reward claim UX patch
        run: python3 .github/scripts/tmp_reward_claim_ux_patch.py
      - name: Run focused Claim UX regressions
        run: node --test tests/reward-claim-ui-resilience.test.mjs tests/i18n-progress-claim-v2.test.mjs tests/i18n-notification-reward-center.test.mjs
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Verify patch cleanliness
        run: git diff --check
      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/HomeClient.tsx \
                  src/components/UnifiedInviteNotificationHistoryCenter.tsx \
                  src/components/InviteNotificationHistoryCenter.tsx \
                  src/lib/i18n/progressClaimCopy.ts \
                  tests/reward-claim-ui-resilience.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Harden reward Claim status UX"
          git push origin HEAD:${GITHUB_REF_NAME}
