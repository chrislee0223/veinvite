name: Temporary reward claim UX patch

on:
  push:
    branches:
      - fix/reward-claim-status-ux-20260915

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply guarded reward claim UX patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, pattern: str, replacement: str, label: str) -> str:
              compiled = re.compile(pattern, re.S)
              updated, count = compiled.subn(lambda _match: replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one replacement, got {count}')
              return updated

          # Home Claim: reconcile ambiguous HTTP outcomes against authoritative server state,
          # start fast receipt tracking on every accepted Claim, and prevent cross-wallet UI bleed.
          home_path = Path('src/components/HomeClient.tsx')
          home = home_path.read_text()
          wallet_reset = "    activeWalletRef.current = wallet;\n    setInvites([]);"
          if home.count(wallet_reset) != 1:
              raise SystemExit('Home wallet reset anchor changed')
          home = home.replace(
              wallet_reset,
              "    activeWalletRef.current = wallet;\n    setClaimPendingCode(null);\n    setInvites([]);",
              1,
          )

          home_replacement = r'''  const reconcileAmbiguousClaim = async (
    inviteCode: string,
    requestWallet: string,
  ): Promise<boolean> => {
    for (const delayMs of [0, 300, 900, 1800]) {
      if (delayMs > 0) {
        await new Promise<void>((resolve) => {
          window.setTimeout(resolve, delayMs);
        });
      }
      if (!sameWallet(activeWalletRef.current, requestWallet)) return false;

      try {
        const response = await fetch(
          `/api/invites?inviter=${encodeURIComponent(requestWallet)}`,
          { cache: 'no-store' },
        );
        let body: { invites?: InviteRecord[] };
        try {
          body = (await response.json()) as { invites?: InviteRecord[] };
        } catch {
          continue;
        }

        if (response.status === 401 || response.status === 403) return false;
        if (!response.ok) continue;
        if (!sameWallet(activeWalletRef.current, requestWallet)) return false;

        const nextInvites = body.invites ?? [];
        setInvites(nextInvites);
        setInvitesReady(true);
        setInvitesFailed(false);

        const current = nextInvites.find(
          (candidate) => candidate.code === inviteCode,
        );
        if (
          current?.rewardEligibility === 'PAID' ||
          current?.rewardQueueStatus === 'QUEUED' ||
          current?.rewardQueueStatus === 'ASSIGNED'
        ) {
          return true;
        }
      } catch {
        // The Claim outcome is ambiguous. Retry the authoritative read only;
        // never submit a second payout or infer success from a transport error.
      }
    }

    return false;
  };

  const claimReward = async (invite: InviteRecord) => {
    if (
      !wallet ||
      claimPendingCode ||
      invite.rewardQueueStatus !== 'AWAITING_CLAIM'
    ) {
      return;
    }

    const requestWallet = wallet;
    clearFeedback();
    reportProductAnalyticsEvent({
      eventName: 'reward_claim_started',
      flowKey: 'home',
    });
    setClaimPendingCode(invite.code);

    const publishAcceptedClaim = async (optimistic: boolean) => {
      if (!sameWallet(activeWalletRef.current, requestWallet)) return;

      if (optimistic) {
        setInvites((current) => current.map((item) =>
          item.code === invite.code && item.rewardEligibility !== 'PAID'
            ? { ...item, rewardQueueStatus: 'QUEUED' }
            : item,
        ));
      }
      reportProductAnalyticsEvent({
        eventName: 'reward_claim_succeeded',
        outcome: 'success',
        flowKey: 'home',
      });
      showFeedback('success', progressCopy.claimQueued);
      window.dispatchEvent(
        new Event('veinvite-reward-claim-updated'),
      );
      await load(true);
    };

    try {
      let response: Response;
      try {
        response = await fetch('/api/rewards/claims', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ inviteCode: invite.code }),
        });
      } catch {
        if (await reconcileAmbiguousClaim(invite.code, requestWallet)) {
          await publishAcceptedClaim(false);
          return;
        }
        reportProductAnalyticsEvent({
          eventName: 'reward_claim_failed',
          outcome: 'failure',
          failureCode: 'network',
          flowKey: 'home',
        });
        throw new Error(progressCopy.claimFailed);
      }

      let data: { error?: string };
      try {
        data = (await response.json()) as { error?: string };
      } catch {
        if (await reconcileAmbiguousClaim(invite.code, requestWallet)) {
          await publishAcceptedClaim(false);
          return;
        }
        reportProductAnalyticsEvent({
          eventName: 'reward_claim_failed',
          outcome: 'failure',
          failureCode: 'malformed_response',
          flowKey: 'home',
        });
        throw new Error(progressCopy.claimFailed);
      }

      if (!response.ok) {
        if (
          response.status !== 401 &&
          response.status !== 403 &&
          await reconcileAmbiguousClaim(invite.code, requestWallet)
        ) {
          await publishAcceptedClaim(false);
          return;
        }
        reportProductAnalyticsEvent({
          eventName: 'reward_claim_failed',
          outcome: 'failure',
          failureCode:
            response.status === 401 || response.status === 403
              ? 'wallet_auth'
              : response.status >= 500
                ? 'server'
                : 'unknown',
          flowKey: 'home',
        });
        throw new Error(data.error ?? progressCopy.claimFailed);
      }

      await publishAcceptedClaim(true);
    } catch (error) {
      if (!sameWallet(activeWalletRef.current, requestWallet)) return;
      showFeedback(
        'error',
        error instanceof Error ? error.message : progressCopy.claimFailed,
      );
    } finally {
      setClaimPendingCode((current) =>
        current === invite.code ? null : current,
      );
    }
  };'''

          home = replace_once(
              home,
              r"  const claimReward = async \(invite: InviteRecord\) => \{.*?\n  \};\n\n  const closeCancelModal",
              home_replacement + "\n\n  const closeCancelModal",
              'Home claim function',
          )
          home_path.write_text(home)

          # Notification center: same fail-closed reconciliation, with finalized receipt
          # evidence required when the live action disappears because payout already settled.
          center_path = Path('src/components/UnifiedInviteNotificationHistoryCenter.tsx')
          center = center_path.read_text()
          center_replacement = r'''  const reconcileAmbiguousClaim = useCallback(async (
    inviteCode: string,
  ): Promise<boolean> => {
    for (const delayMs of [0, 300, 900, 1800]) {
      if (delayMs > 0) {
        await new Promise<void>((resolve) => {
          window.setTimeout(resolve, delayMs);
        });
      }

      const requestId = actionRequestRef.current + 1;
      actionRequestRef.current = requestId;
      setActionLoading(true);

      try {
        const response = await fetch('/api/notifications/reward-actions', {
          cache: 'no-store',
        });
        let body: RewardActionResponse;
        try {
          body = (await response.json()) as RewardActionResponse;
        } catch {
          continue;
        }

        if (response.status === 401 || response.status === 403) return false;
        if (!response.ok || actionRequestRef.current !== requestId) continue;

        const actions = Array.isArray(body.actions) ? body.actions : [];
        setRewardActions(actions);
        setActionError('');
        const matching = actions.find(
          (candidate) => candidate.inviteCode === inviteCode,
        );
        if (
          matching?.status === 'QUEUED' ||
          matching?.status === 'ASSIGNED'
        ) {
          return true;
        }
        if (matching?.status === 'AWAITING_CLAIM') continue;

        const receiptResponse = await fetch('/api/rewards/receipts?limit=50', {
          cache: 'no-store',
        });
        let receiptBody: ReceiptResponse;
        try {
          receiptBody = (await receiptResponse.json()) as ReceiptResponse;
        } catch {
          continue;
        }
        if (!receiptResponse.ok) continue;
        if (
          (receiptBody.receipts ?? []).some(
            (candidate) => candidate.inviteCode === inviteCode,
          )
        ) {
          return true;
        }
      } catch {
        // Retry authoritative reads only. The existing Claim endpoint remains the
        // sole writer and the payout worker remains the sole transfer path.
      } finally {
        if (actionRequestRef.current === requestId) {
          setActionLoading(false);
        }
      }
    }

    return false;
  }, []);

  const claimReward = useCallback(async (action: RewardActionItem) => {
    if (
      claimPendingCode ||
      action.status !== 'AWAITING_CLAIM'
    ) {
      return;
    }

    setClaimPendingCode(action.inviteCode);
    setActionError('');
    reportProductAnalyticsEvent({
      eventName: 'reward_claim_started',
      flowKey: 'home',
    });

    const publishAcceptedClaim = () => {
      setRewardActions((current) => current.map((item) =>
        item.inviteCode === action.inviteCode
          ? { ...item, status: 'QUEUED' }
          : item,
      ));
      reportProductAnalyticsEvent({
        eventName: 'reward_claim_succeeded',
        outcome: 'success',
        flowKey: 'home',
      });
      window.dispatchEvent(new Event(REWARD_CLAIM_UPDATED_EVENT));
      void loadRewardActions();
    };

    try {
      let response: Response;
      try {
        response = await fetch('/api/rewards/claims', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ inviteCode: action.inviteCode }),
        });
      } catch {
        if (await reconcileAmbiguousClaim(action.inviteCode)) {
          publishAcceptedClaim();
          return;
        }
        reportProductAnalyticsEvent({
          eventName: 'reward_claim_failed',
          outcome: 'failure',
          failureCode: 'network',
          flowKey: 'home',
        });
        throw new Error(progressCopy.claimFailed);
      }

      let body: {
        claim?: { status?: string };
        error?: string;
      };
      try {
        body = (await response.json()) as {
          claim?: { status?: string };
          error?: string;
        };
      } catch {
        if (await reconcileAmbiguousClaim(action.inviteCode)) {
          publishAcceptedClaim();
          return;
        }
        reportProductAnalyticsEvent({
          eventName: 'reward_claim_failed',
          outcome: 'failure',
          failureCode: 'malformed_response',
          flowKey: 'home',
        });
        throw new Error(progressCopy.claimFailed);
      }

      if (!response.ok) {
        if (
          response.status !== 401 &&
          response.status !== 403 &&
          await reconcileAmbiguousClaim(action.inviteCode)
        ) {
          publishAcceptedClaim();
          return;
        }
        reportProductAnalyticsEvent({
          eventName: 'reward_claim_failed',
          outcome: 'failure',
          failureCode:
            response.status === 401 || response.status === 403
              ? 'wallet_auth'
              : response.status >= 500
                ? 'server'
                : 'unknown',
          flowKey: 'home',
        });
        throw new Error(body.error || progressCopy.claimFailed);
      }

      publishAcceptedClaim();
    } catch (error) {
      setActionError(
        error instanceof Error ? error.message : progressCopy.claimFailed,
      );
    } finally {
      setClaimPendingCode((current) =>
        current === action.inviteCode ? null : current,
      );
    }
  }, [
    claimPendingCode,
    loadRewardActions,
    progressCopy.claimFailed,
    reconcileAmbiguousClaim,
  ]);'''

          center = replace_once(
              center,
              r"  const claimReward = useCallback\(async \(action: RewardActionItem\) => \{.*?\n  \}, \[claimPendingCode, loadRewardActions, progressCopy\.claimFailed\]\);\n\n  const openRewardReceipt",
              center_replacement + "\n\n  const openRewardReceipt",
              'Notification claim function',
          )
          center_path.write_text(center)

          # A wallet switch must remount the inner panel so old-wallet Claim actions
          # cannot remain visible while the new wallet session resolves.
          facade_path = Path('src/components/InviteNotificationHistoryCenter.tsx')
          facade = facade_path.read_text()
          facade_anchor = '      <UnifiedInviteNotificationHistoryCenter {...props} />'
          if facade.count(facade_anchor) != 1:
              raise SystemExit('Notification facade anchor changed')
          facade = facade.replace(
              facade_anchor,
              "      <UnifiedInviteNotificationHistoryCenter\n        key={wallet ?? 'disconnected'}\n        {...props}\n      />",
              1,
          )
          facade_path.write_text(facade)

          # Keep the same claimQueued key so layout/API contracts do not change, but
          # make it unambiguously mean 'payment is processing', never 'payment done'.
          processing = {
              'en': 'Payout processing',
              'ko': '지급 처리 중',
              'zh': '正在处理发放',
              'hi': 'भुगतान प्रक्रिया में है',
              'es': 'Pago en proceso',
              'ja': '支払い処理中',
              'it': 'Pagamento in elaborazione',
              'tr': 'Ödeme işleniyor',
              'nl': 'Uitbetaling wordt verwerkt',
              'de': 'Auszahlung wird verarbeitet',
              'fr': 'Paiement en cours',
              'ar': 'جارٍ معالجة الدفع',
              'bn': 'পেমেন্ট প্রক্রিয়াধীন',
              'pt': 'Pagamento em processamento',
              'ru': 'Выплата обрабатывается',
              'id': 'Pembayaran sedang diproses',
              'vi': 'Đang xử lý thanh toán',
              'zh-tw': '正在處理發放',
              'sv': 'Utbetalning behandlas',
              'ro': 'Plata este în curs',
              'ur': 'ادائیگی پر کارروائی جاری ہے',
              'pcm': 'Payment dey process',
              'arz': 'جاري معالجة الدفع',
              'mr': 'पेमेंटवर प्रक्रिया सुरू आहे',
              'te': 'చెల్లింపు ప్రాసెస్‌లో ఉంది',
              'sw': 'Malipo yanachakatwa',
              'ha': 'Ana sarrafa biyan kuɗi',
              'el': 'Η πληρωμή επεξεργάζεται',
          }
          copy_path = Path('src/lib/i18n/progressClaimCopy.ts')
          copy = copy_path.read_text()
          for locale, value in processing.items():
              key = f"'{locale}'" if '-' in locale else locale
              line_pattern = re.compile(rf"(?m)^  {re.escape(key)}: \{{.*$")
              match = line_pattern.search(copy)
              if not match:
                  raise SystemExit(f'progress copy line missing for {locale}')
              line = match.group(0)
              escaped = value.replace('\\', '\\\\').replace("'", "\\'")
              updated_line, count = re.subn(
                  r"claimQueued: '[^']*'",
                  f"claimQueued: '{escaped}'",
                  line,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'claimQueued missing for {locale}')
              copy = copy[:match.start()] + updated_line + copy[match.end():]
          copy_path.write_text(copy)

          test_path = Path('tests/reward-claim-ui-resilience.test.mjs')
          test_path.write_text(r'''import assert from 'node:assert/strict';
import { readFileSync } from 'node:fs';
import test from 'node:test';

const home = readFileSync('src/components/HomeClient.tsx', 'utf8');
const center = readFileSync(
  'src/components/UnifiedInviteNotificationHistoryCenter.tsx',
  'utf8',
);
const facade = readFileSync(
  'src/components/InviteNotificationHistoryCenter.tsx',
  'utf8',
);
const progressCopy = readFileSync(
  'src/lib/i18n/progressClaimCopy.ts',
  'utf8',
);

test('Home Claim reconciles ambiguous transport outcomes before reporting failure', () => {
  assert.match(home, /const reconcileAmbiguousClaim = async/);
  assert.match(home, /for \(const delayMs of \[0, 300, 900, 1800\]\)/);
  assert.match(home, /current\?\.rewardEligibility === 'PAID'/);
  assert.match(home, /current\?\.rewardQueueStatus === 'QUEUED'/);
  assert.match(home, /current\?\.rewardQueueStatus === 'ASSIGNED'/);
  assert.match(home, /new Event\('veinvite-reward-claim-updated'\)/);

  const claimStart = home.indexOf('const claimReward = async');
  const firstReconcile = home.indexOf('await reconcileAmbiguousClaim(', claimStart);
  const networkFailure = home.indexOf("failureCode: 'network'", claimStart);
  assert.ok(claimStart >= 0 && firstReconcile > claimStart);
  assert.ok(networkFailure > firstReconcile);
});

test('Claim UI is reset across wallet switches and pending clears are request-scoped', () => {
  assert.match(home, /activeWalletRef\.current = wallet;\s+setClaimPendingCode\(null\);/);
  assert.match(
    home,
    /setClaimPendingCode\(\(current\) =>\s+current === invite\.code \? null : current/,
  );
  assert.match(facade, /key=\{wallet \?\? 'disconnected'\}/);
});

test('notification Claim uses the same fail-closed reconciliation and finalized receipt evidence', () => {
  assert.match(center, /const reconcileAmbiguousClaim = useCallback/);
  assert.match(center, /matching\?\.status === 'QUEUED'/);
  assert.match(center, /matching\?\.status === 'ASSIGNED'/);
  assert.match(center, /\/api\/rewards\/receipts\?limit=50/);
  assert.match(center, /candidate\.inviteCode === inviteCode/);

  const claimStart = center.indexOf('const claimReward = useCallback');
  const firstReconcile = center.indexOf('await reconcileAmbiguousClaim(', claimStart);
  const networkFailure = center.indexOf("failureCode: 'network'", claimStart);
  assert.ok(claimStart >= 0 && firstReconcile > claimStart);
  assert.ok(networkFailure > firstReconcile);
});

test('queued copy clearly describes processing, not completed payment', () => {
  assert.match(progressCopy, /en: \{[^\n]*claimQueued: 'Payout processing'/);
  assert.match(progressCopy, /ko: \{[^\n]*claimQueued: '지급 처리 중'/);
  assert.doesNotMatch(progressCopy, /claimQueued: 'Payout requested'/);
  assert.doesNotMatch(progressCopy, /claimQueued: '지급 요청 완료'/);
});
''')
          PY
      - name: Run focused Claim UX regressions
        run: node --test tests/reward-claim-ui-resilience.test.mjs tests/i18n-progress-claim-v2.test.mjs tests/i18n-notification-reward-center.test.mjs
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Verify patch cleanliness
        run: git diff --check
      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/HomeClient.tsx \
                  src/components/UnifiedInviteNotificationHistoryCenter.tsx \
                  src/components/InviteNotificationHistoryCenter.tsx \
                  src/lib/i18n/progressClaimCopy.ts \
                  tests/reward-claim-ui-resilience.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Harden reward Claim status UX"
          git push origin HEAD:${GITHUB_REF_NAME}
