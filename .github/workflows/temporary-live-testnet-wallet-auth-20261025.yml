name: Temporary isolated live testnet wallet auth HTTP smoke

on:
  push:
    branches:
      - ci/testnet-wallet-auth-http-20261025

permissions:
  contents: read

jobs:
  signed-testnet-auth-http:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_PREVIEW_URL: https://veinvite-m95t64akr-veinvite.vercel.app
      EXPECTED_PREVIEW_COMMIT: 44f4876a6f81d1521b0cf69ba8b56b2ac59fb564
    steps:
      - name: Checkout reviewed integration code (only to obtain audited dependencies)
        uses: actions/checkout@v7
      - name: Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies without connecting secrets
        run: npm ci --no-fund --no-audit
      - name: Verify genuine signed-certificate HTTP auth against isolated testnet Preview
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { Wallet, getBytes } from 'ethers';
          import { Certificate } from '@vechain/sdk-core';

          const base = process.env.EXPECTED_PREVIEW_URL;
          const url = new URL(base);
          // Hard stop if this job is ever reconfigured toward the real product.
          assert.equal(url.protocol, 'https:');
          assert.equal(url.hostname, 'veinvite-m95t64akr-veinvite.vercel.app');
          assert.ok(!url.pathname || url.pathname === '/');
          const origin = url.origin;
          const expectedSha = process.env.EXPECTED_PREVIEW_COMMIT;
          assert.equal(expectedSha, '44f4876a6f81d1521b0cf69ba8b56b2ac59fb564');

          const call = async (path, method = 'GET', body = undefined, cookie = undefined) => {
            const headers = {
              'Content-Type': 'application/json',
              Origin: origin,
            };
            if (cookie) headers.Cookie = cookie;
            const res = await fetch(origin + path, {
              method, headers,
              body: body === undefined ? undefined : JSON.stringify(body),
              redirect: 'manual',
              signal: AbortSignal.timeout(20000),
            });
            const text = await res.text();
            let result = null;
            try { result = JSON.parse(text); } catch {}
            return { res, status: res.status, data: result };
          };

          const health = await call('/api/health');
          assert.equal(health.status, 200, 'preview health endpoint unavailable');
          assert.equal(health.data?.network, 'testnet', 'MUST use testnet, never mainnet');
          assert.equal(health.data?.database, 'ready');
          assert.equal(health.data?.deployment?.environment, 'preview');
          assert.equal(health.data?.deployment?.gitCommitSha, expectedSha);
          console.log('Testnet Preview, commit, and isolated DB ready.');

          // Never use a user's wallet, stored keys, or Production mainnet balance.
          const wallet = Wallet.createRandom();
          const address = wallet.address.toLowerCase();
          const challenge = await call('/api/auth/challenge', 'POST', {
            walletAddress: address,
          });
          assert.equal(challenge.status, 201, 'test-only challenge was not issued');
          assert.equal(challenge.data.network, 'testnet');
          assert.equal(challenge.data.origin, origin);
          assert.equal(challenge.data.walletAddress, address);
          assert.match(challenge.data.nonce, /^[a-f0-9]{64}$/);
          assert.ok(challenge.data.message.includes('Network: testnet'));
          console.log('Fresh anonymous testnet wallet challenge issued.');

          const cert = Certificate.of({
            purpose: 'agreement',
            payload: { type: 'text', content: challenge.data.message },
            domain: url.hostname,
            timestamp: Math.floor(Date.now() / 1000),
            signer: wallet.address,
          });
          cert.sign(getBytes(wallet.privateKey));
          const certificate = {
            purpose: cert.purpose,
            payload: cert.payload,
            domain: cert.domain,
            timestamp: cert.timestamp,
            signer: cert.signer,
            signature: cert.signature,
          };
          const payload = {
            walletAddress: address,
            nonce: challenge.data.nonce,
            proofType: 'certificate',
            certificate,
          };

          const invalid = await call('/api/auth/verify', 'POST', {
            ...payload, certificate: { ...certificate, domain: 'attacker.example' },
          });
          assert.equal(invalid.status, 401, 'wrong-domain proof must fail closed');
          console.log('Forged certificate origin rejected.');

          const valid = await call('/api/auth/verify', 'POST', payload);
          assert.equal(valid.status, 201, 'real certificate must issue session');
          assert.equal(valid.data?.walletAddress, address);
          const cookies = typeof valid.res.headers.getSetCookie === 'function'
            ? valid.res.headers.getSetCookie()
            : [valid.res.headers.get('set-cookie') || ''];
          const match = cookies.join('\n').match(/(?:^|\n)__Host-veinvite_session=([0-9a-f]{64})(?:;|$)/);
          assert.ok(match, 'secure host-scoped auth cookie was not issued');
          const sessionCookie = '__Host-veinvite_session=' + match[1];
          const read = await call('/api/auth/session', 'GET', undefined, sessionCookie);
          assert.equal(read.status, 200);
          assert.equal(read.data?.authenticated, true);
          assert.equal(read.data?.walletAddress, address);
          console.log('Genuine signed testnet auth session persisted and verified.');

          const replay = await call('/api/auth/verify', 'POST', payload);
          assert.equal(replay.status, 409, 'challenge reuse must be rejected');
          console.log('Used challenge replay rejected.');

          const logout = await call('/api/auth/session', 'DELETE', undefined, sessionCookie);
          assert.equal(logout.status, 200);
          assert.equal(logout.data?.authenticated, false);
          const after = await call('/api/auth/session', 'GET', undefined, sessionCookie);
          assert.equal(after.status, 200);
          assert.equal(after.data?.authenticated, false);
          console.log('Session logout invalidated the old browser cookie.');

          // No transfers, referral missions, X API calls, or funded endpoints.
          console.log('PASS: live testnet HTTP challenge/certificate/session/logout.');
          NODE
