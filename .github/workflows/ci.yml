name: VeInvite CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: veinvite-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Build against the reviewed non-production project identity. The key is
      # intentionally a non-secret placeholder: CI must never read or mutate a
      # live Supabase database.
      NEXT_PUBLIC_SUPABASE_URL: https://bpppslplhmppxzvdkwxs.supabase.co
      SUPABASE_SECRET_KEY: ci-placeholder-not-a-real-key
      VERCEL_ENV: preview
      VECHAIN_NETWORK: testnet
      NEXT_PUBLIC_NETWORK_TYPE: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Migration history gate
        run: node scripts/check-migration-history.mjs

      - name: UI stability gate
        run: node scripts/check-ui-stability.mjs

      - name: Leaderboard stability gate
        run: node scripts/check-leaderboard-stability.mjs

      - name: User-facing copy and UX gate
        run: node scripts/check-user-facing-copy.mjs

      - name: Profile cleanup regression gate
        run: node scripts/check-profile-cleanup.mjs

      - name: Final audit resilience gate
        run: node scripts/check-final-audit-resilience.mjs

      - name: Admin dynamic rendering gate
        run: node scripts/check-admin-dynamic.mjs

      - name: Forecast stability gate
        run: node scripts/check-forecast-stability.mjs

      - name: Server stability gate
        run: node scripts/check-server-stability.mjs

      - name: Documentation drift gate
        run: node scripts/check-documentation-drift.mjs

      - name: Vercel deployment policy gate
        run: node scripts/check-vercel-deployment-policy.mjs

      - name: Audit hardening gate
        run: node scripts/check-audit-hardening.mjs

      - name: API mutation origin gate
        run: node scripts/check-mutation-origin.mjs

      - name: Invite reconciliation gate
        run: node scripts/check-progress-reconciliation.mjs

      - name: Recipient B3TR forensic gate
        run: node scripts/check-recipient-b3tr-forensics.mjs

      - name: Re-entry persistence gate
        run: node scripts/check-reentry-persistence.mjs

      - name: Language/session stability gate
        run: node scripts/check-language-session-stability.mjs

      - name: Wallet session continuity gate
        run: node scripts/check-wallet-session-continuity.mjs

      - name: VeWorld startup readiness gate
        run: node --experimental-strip-types --test tests/home-startup-readiness.test.mjs tests/first-paint-startup-shell.test.mjs tests/wallet-first-login-transition.test.mjs

      - name: Usage analytics privacy gate
        run: node --test tests/usage-analytics-privacy.test.mjs

      - name: Admin analytics exclusion gate
        run: node --test tests/admin-analytics-exclusions.test.mjs

      - name: Fast operator status gate
        run: node --test tests/operator-fast-status*.test.mjs

      - name: Referral v2 regression gate
        run: node --test tests/referral-permanent-link-rollout.test.mjs tests/referral-v2-legacy-cancel-copy.test.mjs tests/network-guide-relocation.test.mjs tests/referral-link-refresh-cache.test.mjs tests/invite-flow-visual-parity.test.mjs tests/mission-dapp-action.test.mjs

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2; do
            if timeout 180s npm ci; then
              exit 0
            fi
            status=$?
            if [ "$status" -eq 124 ] && [ "$attempt" -lt 2 ]; then
              rm -rf node_modules
              sleep 5
              continue
            fi
            exit "$status"
          done
          exit 1

      - name: Dependency security gate
        # Keep low/moderate transitive findings visible in CI, but fail the
        # merge gate only when npm reports a high or critical vulnerability.
        # Retry only registry/service transport failures or a bounded service
        # hang; a real vulnerability result still fails immediately.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if output="$(timeout 60s npm audit --audit-level=high 2>&1)"; then
              printf '%s\n' "$output"
              exit 0
            else
              status=$?
              printf '%s\n' "$output"
            fi

            if [ "$status" -eq 124 ] || printf '%s\n' "$output" | grep -Eqi '503|Service Unavailable|ECONNRESET|ETIMEDOUT|audit endpoint returned an error'; then
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
                continue
              fi
            fi

            exit "$status"
          done

          exit 1

      - name: Typecheck
        run: npm run typecheck

      - name: Localization completeness gate
        run: npm run test:i18n

      - name: Reward accounting regression tests
        run: npm run test:rewards

      - name: Production build
        run: npm run build
