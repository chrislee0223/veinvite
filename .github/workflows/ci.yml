name: VeInvite CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: veinvite-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI always targets the reviewed non-production identity. Keeping this at the
# workflow level makes every parallel job use the same safe environment.
env:
  NEXT_PUBLIC_SUPABASE_URL: https://bpppslplhmppxzvdkwxs.supabase.co
  SUPABASE_SECRET_KEY: ci-placeholder-not-a-real-key
  VERCEL_ENV: preview
  VECHAIN_NETWORK: testnet
  NEXT_PUBLIC_NETWORK_TYPE: test

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Migration history gate
        run: node scripts/check-migration-history.mjs

      - name: Disaster recovery gate
        run: |
          bash -n scripts/backup-production-db.sh scripts/restore-db-drill.sh
          node scripts/check-disaster-recovery.mjs

      - name: Codebase cleanup audit
        run: node scripts/audit-codebase-cleanup.mjs --json=.ci/codebase-cleanup-audit.json --enforce-unused --large-baseline=scripts/codebase-large-source-baseline.json

      - name: Upload codebase cleanup audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codebase-cleanup-audit-${{ github.run_id }}
          path: .ci/codebase-cleanup-audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Browser QA scope policy gate
        run: node --test tests/ci-browser-scope.test.mjs

      - name: UI stability gate
        run: node scripts/check-ui-stability.mjs

      - name: QA Studio architecture gate
        run: node scripts/check-qa-studio.mjs

      - name: Production QA state coverage gate
        run: node scripts/check-qa-production-state-coverage.mjs

      - name: Leaderboard stability gate
        run: node scripts/check-leaderboard-stability.mjs

      - name: Profile avatar parity gate
        run: >-
          node --test
          tests/leaderboard-avatar-loading-stability.test.mjs
          tests/leaderboard-mobile-avatar-reward-balance.test.mjs
          tests/network-center-avatar-public-slots.test.mjs
          tests/network-ios-native-gesture-guard.test.mjs

      - name: Network camera geometry behavior gate
        run: node --experimental-strip-types --test tests/network-canvas-geometry-behavior.test.mjs

      - name: Network search regression gate
        run: node --test tests/network-domain-autocomplete-hardening.test.mjs

      - name: Network drag geometry behavior gate
        run: node --experimental-strip-types --test tests/network-workspace-drag-geometry.test.mjs

      - name: Network group workspace behavior gate
        run: node --experimental-strip-types --test tests/network-workspace-group-operations.test.mjs

      - name: User-facing copy and UX gate
        run: node scripts/check-user-facing-copy.mjs

      - name: Profile cleanup regression gate
        run: node scripts/check-profile-cleanup.mjs

      - name: Final audit resilience gate
        run: node scripts/check-final-audit-resilience.mjs

      - name: Admin dynamic rendering gate
        run: node scripts/check-admin-dynamic.mjs

      - name: Admin API authentication gate
        run: node scripts/check-admin-api-auth.mjs

      - name: Forecast stability gate
        run: node scripts/check-forecast-stability.mjs

      - name: Server stability gate
        run: node scripts/check-server-stability.mjs

      - name: Documentation drift gate
        run: node scripts/check-documentation-drift.mjs

      - name: Vercel deployment policy gate
        run: node scripts/check-vercel-deployment-policy.mjs

      - name: Audit hardening gate
        run: node scripts/check-audit-hardening.mjs

      - name: API mutation origin gate
        run: node scripts/check-mutation-origin.mjs

      - name: Invite reconciliation gate
        run: node scripts/check-progress-reconciliation.mjs

      - name: Recipient B3TR forensic gate
        run: node scripts/check-recipient-b3tr-forensics.mjs

      - name: Sybil v2 pipeline primitives gate
        run: node --experimental-strip-types --test tests/reward-sybil-v2-pipeline-primitives.test.mjs

      - name: Re-entry persistence gate
        run: node scripts/check-reentry-persistence.mjs

      - name: Language/session stability gate
        run: node scripts/check-language-session-stability.mjs

      - name: Wallet session continuity gate
        run: node scripts/check-wallet-session-continuity.mjs

      - name: VeWorld startup readiness gate
        run: node --experimental-strip-types --test tests/home-startup-readiness.test.mjs tests/home-startup-performance.test.mjs tests/home-startup-placeholder-regression.test.mjs tests/first-paint-startup-shell.test.mjs tests/wallet-first-login-transition.test.mjs tests/wallet-switch-transition.test.mjs

      - name: Usage analytics privacy gate
        run: node --test tests/usage-analytics-privacy.test.mjs tests/usage-analytics-hardening.test.mjs tests/analytics-lifecycle-edge-cases.test.mjs tests/analytics-purge-recovery-hardening.test.mjs tests/product-analytics-privacy.test.mjs tests/wallet-language-privacy.test.mjs tests/legal-document-sheet.test.mjs

      - name: Admin analytics exclusion gate
        run: node --test tests/admin-analytics-exclusions.test.mjs

      - name: Fast operator status gate
        run: node --test tests/operator-fast-status*.test.mjs

      - name: Referral v2 regression gate
        run: node --test tests/referral-permanent-link-rollout.test.mjs tests/referral-v2-legacy-cancel-copy.test.mjs tests/network-guide-relocation.test.mjs tests/referral-link-refresh-cache.test.mjs tests/invite-flow-visual-parity.test.mjs tests/mission-dapp-action.test.mjs tests/referral-quality-country-integrity.test.mjs

      - name: Mission dApp attribution gate
        run: node --test tests/mission-dapp-attribution.test.mjs

      - name: Standalone regression coverage gate
        run: >-
          node --test
          tests/demo-completion-mission-parity.test.mjs
          tests/invitee-mission-actions.test.mjs
          tests/legacy-invite-claim-retry.test.mjs
          tests/legacy-invite-cancel-retry.test.mjs
          tests/network-single-runtime.test.mjs
          tests/network-top-controls.test.mjs
          tests/network-public-readonly-navigation.test.mjs
          tests/notification-ack-batch-atomicity.test.mjs
          tests/notification-history-fast-open.test.mjs
          tests/operator-fast-invitation-projection-privilege.test.mjs
          tests/referral-link-ensure-serialization.test.mjs
          tests/referral-slot-capacity-parity.test.mjs
          tests/referral-two-slot-foundation.test.mjs
          tests/referral-view-migration-compat.test.mjs
          tests/wallet-auth-typed-data.test.mjs
          tests/wallet-session-provider-gap.test.mjs

  browser:
    name: browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Detect browser QA scope
        id: browser-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          changed_paths=''
          if [ "$EVENT_NAME" = 'push' ] && [ "$REF_NAME" = 'refs/heads/main' ]; then
            changed_paths='main-push'
          elif [ -n "${BASE_SHA:-}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            changed_paths="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          fi

          result="$(
            CHANGED_PATHS="$changed_paths" \
            GITHUB_EVENT_NAME="$EVENT_NAME" \
            GITHUB_REF="$REF_NAME" \
            node scripts/should-run-browser-qa.mjs
          )"

          if [ "$result" != 'true' ] && [ "$result" != 'false' ]; then
            echo "Invalid browser QA scope result: $result" >&2
            exit 1
          fi

          echo "run_browser=$result" >> "$GITHUB_OUTPUT"
          printf 'Browser QA required: %s\n' "$result"
          if [ -n "$changed_paths" ]; then
            printf '%s\n' "$changed_paths"
          else
            echo 'No reliable diff was available; classifier fails safe to browser QA.'
          fi

      - name: Browser QA skipped for backend-only pull request
        if: steps.browser-scope.outputs.run_browser == 'false'
        run: echo 'Full browser QA is skipped on this pull request; main pushes always run it.'

      - name: Restore Playwright browser cache
        if: steps.browser-scope.outputs.run_browser == 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.browser-scope.outputs.run_browser == 'true'
        shell: bash
        run: |
          for attempt in 1 2; do
            set +e
            timeout 300s npm ci
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$status" -eq 124 ] && [ "$attempt" -lt 2 ]; then
              rm -rf node_modules
              sleep 5
              continue
            fi
            exit "$status"
          done
          exit 1

      - name: Install Playwright system dependencies
        if: steps.browser-scope.outputs.run_browser == 'true'
        run: npx playwright install-deps chromium

      - name: Install Playwright Chromium
        if: steps.browser-scope.outputs.run_browser == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Visual and multilingual browser QA
        if: steps.browser-scope.outputs.run_browser == 'true'
        run: npm run test:playwright

      - name: Upload Playwright QA evidence
        if: always() && steps.browser-scope.outputs.run_browser == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-qa-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 7

  verify:
    name: build and regression
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'next.config.mjs', 'sentry.*.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2; do
            set +e
            timeout 300s npm ci 2>&1 | tee .ci-npm-ci.log
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$status" -eq 124 ] && [ "$attempt" -lt 2 ]; then
              rm -rf node_modules
              sleep 5
              continue
            fi
            exit "$status"
          done
          exit 1

      - name: Wallet auth cryptographic regression gate
        run: node --experimental-strip-types --test tests/wallet-auth-typed-data-crypto.test.mjs

      - name: Dependency security gate
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if output="$(timeout 60s npm audit --audit-level=high 2>&1)"; then
              printf '%s\n' "$output"
              exit 0
            else
              status=$?
              printf '%s\n' "$output"
            fi

            transport_failure=false
            if [ "$status" -eq 124 ] || printf '%s\n' "$output" | grep -Eqi '503|Service Unavailable|ECONNRESET|ETIMEDOUT|audit endpoint returned an error'; then
              transport_failure=true
            fi

            if [ "$transport_failure" = true ] && [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
              continue
            fi

            if [ "$transport_failure" = true ]; then
              summary="$(grep -E '([0-9]+ vulnerabilities|found 0 vulnerabilities)' .ci-npm-ci.log | tail -1 || true)"
              if [ -z "$summary" ]; then
                echo 'npm audit service was unavailable and npm ci produced no auditable vulnerability summary.' >&2
                exit 1
              fi
              if printf '%s\n' "$summary" | grep -Eqi '([1-9][0-9]*) high|([1-9][0-9]*) critical'; then
                echo "npm ci reported a high/critical vulnerability: $summary" >&2
                exit 1
              fi
              echo "npm audit service unavailable after retries; npm ci audit summary accepted: $summary"
              exit 0
            fi

            exit "$status"
          done

          exit 1

      - name: Typecheck
        run: npm run typecheck

      - name: Localization completeness gate
        run: npm run test:i18n

      - name: Reward accounting regression tests
        run: npm run test:rewards

      - name: Sentry observability regression tests
        run: npm run test:sentry

      - name: Production build
        env:
          NEXT_PUBLIC_SENTRY_DSN: https://ci-public-key@o0.ingest.sentry.io/1
          SENTRY_DSN: https://ci-public-key@o0.ingest.sentry.io/1
          SENTRY_ENVIRONMENT: ci
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ci
        run: npm run build

  # Keep the historical required check name stable while the expensive work
  # runs in parallel above. A merge still requires every partition to succeed.
  validate:
    name: validate
    if: always()
    needs:
      - preflight
      - browser
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require every CI partition
        shell: bash
        run: |
          printf 'preflight=%s\n' '${{ needs.preflight.result }}'
          printf 'browser=%s\n' '${{ needs.browser.result }}'
          printf 'verify=%s\n' '${{ needs.verify.result }}'

          test '${{ needs.preflight.result }}' = 'success'
          test '${{ needs.browser.result }}' = 'success'
          test '${{ needs.verify.result }}' = 'success'
