name: Czech Locale Autofix

on:
  push:
    branches:
      - feat/czech-locale

permissions:
  contents: write

jobs:
  complete-czech:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/czech-locale
          fetch-depth: 0
      - name: Complete Czech locale tables
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def bounds(text, name):
              pos = text.index(name)
              eq = text.index('=', pos)
              start = text.index('{', eq)
              i = start
              depth = 0
              quote = None
              line_comment = False
              block_comment = False
              escape = False
              while i < len(text):
                  c = text[i]
                  n = text[i+1] if i + 1 < len(text) else ''
                  if line_comment:
                      if c == '\n': line_comment = False
                      i += 1; continue
                  if block_comment:
                      if c == '*' and n == '/': block_comment = False; i += 2; continue
                      i += 1; continue
                  if quote:
                      if escape: escape = False
                      elif c == '\\': escape = True
                      elif c == quote: quote = None
                      i += 1; continue
                  if c == '/' and n == '/': line_comment = True; i += 2; continue
                  if c == '/' and n == '*': block_comment = True; i += 2; continue
                  if c in "'\"`": quote = c; i += 1; continue
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0: return start, i
                  i += 1
              raise RuntimeError(f'Could not find end of {name}')

          def add(path, name, entry):
              p = Path(path)
              text = p.read_text()
              start, end = bounds(text, name)
              segment = text[start:end]
              if re.search(r'^\s*cs\s*:', segment, re.M):
                  return
              if not entry.endswith('\n'): entry += '\n'
              p.write_text(text[:end] + entry + text[end:])

