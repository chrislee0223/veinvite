name: Network Finalize Pass 2 Once

on:
  push:
    branches:
      - restore/network-final-interactions

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: restore/network-final-interactions
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded Network finalization
        run: |
          node scripts/network-finalize-prepass.mjs
          node scripts/network-finalize-pass2.mjs

      - name: Verify final Network contract
        run: |
          git diff --check
          node --test tests/network-single-runtime.test.mjs
          npm run typecheck

      - name: Commit finalized Network interactions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/network-finalize-prepass.mjs scripts/network-finalize-pass2.mjs .github/workflows/network-finalize-pass2-once.yml
          git add src/components/AppNetwork.tsx tests/network-single-runtime.test.mjs
          git commit -m "Restore final Network interactions"
          git push origin HEAD:restore/network-final-interactions
