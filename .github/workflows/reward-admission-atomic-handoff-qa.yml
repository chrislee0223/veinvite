name: Reward Admission Atomic Handoff QA
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261104010000_reward_admission_atomic_handoff_staged_disabled.sql'
      - 'supabase/migrations/20261104035500_reward_admission_handoff_exact_recovery_proof_disabled.sql'
      - 'tests/sql/reward-admission-handoff-exact-recovery-proof-assert.sql'
      - 'tests/sql/reward-admission-atomic-handoff-*.sql'
      - 'tests/sql/reward-admission-hold-writer-*.sql'
      - 'tests/sql/reward-admission-invalid-release-*.sql'
      - 'tests/sql/reward-admission-inviter-release-guard-*.sql'
      - 'tests/sql/reward-admission-service-handoff-gateway-assert.sql'
      - 'tests/sql/reward-admission-funded-entry-candidate*.sql'
      - 'supabase/migrations/20261104193600_reward_admission_funded_hold_entry_disabled.sql'
      - 'supabase/migrations/20261105084500_reward_admission_future_only_db_policy_disabled.sql'
      - 'supabase/migrations/20261105095700_reward_elastic_closed_cohort_staged_disabled.sql'
      - 'supabase/migrations/20261105100100_reward_elastic_closed_cohort_x_no_legacy_fallback.sql'
      - 'supabase/migrations/20261105113000_reward_elastic_pending_slots_staged_disabled.sql'
      - 'supabase/migrations/20261105113500_reward_elastic_closure_liveness_service_only.sql'
      - 'supabase/migrations/20261105114000_reward_elastic_source_unsettled_slots_reader.sql'
      - 'supabase/migrations/20261105114500_reward_boost_source_elastic_unswept_interlock.sql'
      - 'supabase/migrations/20261105215300_reward_elastic_global_contingent_physical_collateral.sql'
      - 'supabase/migrations/20261105215700_reward_elastic_own_contingent_exact_once_pricing.sql'
      - 'tests/sql/reward-elastic-own-escrow-canonical-payout-assert.sql'
      - 'supabase/migrations/20261105215900_reward_elastic_postclaim_x_source_sweep_guard.sql'
      - 'supabase/migrations/20261105220500_reward_elastic_future_activation_binding_guard.sql'
      - 'supabase/migrations/20261105221500_reward_elastic_terminal_sybil_candidate_exclusion.sql'
      - 'supabase/migrations/20261106020100_reward_elastic_terminal_contingent_release.sql'
      - 'supabase/migrations/20261106030300_reward_elastic_canonical_own_escrow_exact_transfer.sql'
      - 'tests/sql/reward-elastic-canonical-self-escrow-*.sql'
      - 'tests/sql/reward-elastic-terminal-contingent-release-assert.sql'
      - 'tests/sql/reward-elastic-blocked-vs-pending-assert.sql'
      - 'tests/sql/reward-elastic-binding-guard-*.sql'
      - 'tests/sql/reward-elastic-postclaim-x-sweep-*.sql'
      - 'tests/sql/reward-elastic-global-physical-collateral-assert.sql'
      - 'src/lib/rewards/operationsMonitoring.ts'
      - 'tests/sql/reward-elastic-real-closure-*.sql'
      - 'src/lib/rewards/rewardReservation.ts'
      - 'tests/sql/reward-admission-future-only-db-policy-assert.sql'
      - 'supabase/migrations/20261105020645_reward_admission_terminal_hold_release_disabled.sql'
      - 'tests/sql/reward-admission-terminal-hold-release-assert.sql'
      - 'supabase/migrations/20261104191828_reward_admission_service_handoff_disabled.sql'
      - 'src/lib/rewards/rewardReservation.ts'
      - '.github/workflows/reward-admission-atomic-handoff-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fake-ci-only
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: fake-ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Create fake QA-only financial schema and canonical X/base readers
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-admission-atomic-lab.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-admission-payout-handoff-lab.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-admission-production-bridge-stubs.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261104030000_reward_admission_staged_read_bridge.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-admission-canonical-reader-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261104093000_reward_admission_canonical_held_readers_disabled.sql
      - name: Install exact candidate staged-only handoff function
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261104010000_reward_admission_atomic_handoff_staged_disabled.sql
      - name: Strengthen future handoff with exact active recovery settlement proof
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261104035500_reward_admission_handoff_exact_recovery_proof_disabled.sql
      - name: Create fake completion Sybil and recovery writer
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-admission-atomic-handoff-fixture.sql
      - name: Install candidate private funded admission writer in fake DB only
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-admission-funded-entry-candidate.sql
      - name: Install staged hard-disabled service admission writer in disposable DB
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261104193600_reward_admission_funded_hold_entry_disabled.sql
      - name: Prove activated-only, fresh-finality and exact-collateral admission
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-admission-funded-entry-candidate-assert.sql
      - name: Install staged terminal invalid-HELD release in disposable DB
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261105020645_reward_admission_terminal_hold_release_disabled.sql
      - name: Prove exact once blocked release and unresolved invite conservation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-admission-terminal-hold-release-assert.sql
      - name: Install staged service-only completion gateway and HELD queue interlock
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261104191828_reward_admission_service_handoff_disabled.sql
      - name: Prove withheld Claim and X recovery cannot bypass original HELD
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-admission-service-handoff-gateway-assert.sql
      - name: Assert hard-disabled Production-style gate and role isolation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-admission-atomic-handoff-disabled-assert.sql
      - name: Install fake disabled admission creation prototype
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-admission-hold-writer-lab.sql
      - name: Prove fake hold creation, budget, duplicate, Sybil and rollback gates
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-admission-hold-writer-assert.sql
      - name: Install fake blocked-invite release prototype
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-admission-invalid-release-lab.sql
      - name: Reject unreviewed/fixed release and replay in fake DB
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-admission-invalid-release-assert.sql
      - name: Install safe inviter cancellation SQL candidate from live function
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-admission-inviter-release-guard-lab.sql
      - name: Prove HELD, converted and recovery cannot be orphaned
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-admission-inviter-release-guard-assert.sql
      - name: Assert held/fixed/paid, replay, X and underfunding rollback
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-admission-atomic-handoff-simple-assert.sql
      - name: Assert partial/full recovery GROSS and NET exact reconciliation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-admission-atomic-handoff-recovery-assert.sql
      - name: Simulate Claim QUEUED to ASSIGNED to PAID with LIVE X and recovery
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-admission-atomic-handoff-claim-x-integration-assert.sql
      - name: Reject fake inactive or wrong-offset recovery evidence without consuming HELD
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-admission-handoff-exact-recovery-proof-assert.sql
      - name: Verify core SQL crash and wrong funding receipt never consume HELD
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-admission-atomic-handoff-core-failure-assert.sql
      - name: Restore settings to disabled in fake QA DB
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "UPDATE reward_admission_bridge.settings SET enabled=false WHERE id=1;"
          psql -X -v ON_ERROR_STOP=1 -c "ALTER TABLE reward_admission_bridge.settings ADD CONSTRAINT settings_enabled_check CHECK (enabled=false);"
      - name: Install new future-only DB policy while admission remains disabled
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261105084500_reward_admission_future_only_db_policy_disabled.sql
      - name: Assert historical exclusion, minimum policy, and no financial writes
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-admission-future-only-db-policy-assert.sql
      - name: Create fake officially closed VeBetter cohort and protected financial sources
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-elastic-real-closure-fixture.sql
      - name: Install real closed-cohort elastic writer DISABLED in isolated PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261105095700_reward_elastic_closed_cohort_staged_disabled.sql
      - name: Apply verified forward-only X collateral correction in fake SQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261105100100_reward_elastic_closed_cohort_x_no_legacy_fallback.sql
      - name: Assert actual payout winner split, pending safeguard and double-charge protection
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-elastic-real-closure-assert.sql
      - name: Stage pending-slot protection OFF before verifying late-completion payout
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261105113000_reward_elastic_pending_slots_staged_disabled.sql
      - name: Prove payouts preserve unfinished rights, X and double-payment protections
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-elastic-protected-partial-assert.sql
      - name: Install operator-only liveness reader
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261105113500_reward_elastic_closure_liveness_service_only.sql
      - name: Prove no false positives for not-yet-closed cohorts
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-elastic-closure-liveness-assert.sql
      - name: Install future-only contingent source-sweep detector
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261105114000_reward_elastic_source_unsettled_slots_reader.sql
      - name: Prepare fake reserve-source readers in disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-elastic-source-sweep-protection-lab.sql
      - name: Protect source discovery and execution against contingent obligations
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261105114500_reward_boost_source_elastic_unswept_interlock.sql
      - name: Reject SOURCE_SWEEP while any pending future referral holds a cohort share
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-elastic-source-sweep-protection-assert.sql
      - name: Install global future-cohort physical hold into ALL base/X outstanding readers
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261105215300_reward_elastic_global_contingent_physical_collateral.sql
      - name: Verify global budget cannot be spent by X/other cohorts before or after Claim
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-elastic-global-physical-collateral-assert.sql
      - name: Allow exact one cohort's own physical escrow for pricing but not for outside signers
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261105215700_reward_elastic_own_contingent_exact_once_pricing.sql
      - name: Ensure two early verified winners reserve from OWN escrow while third stays protected
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-elastic-own-escrow-canonical-payout-assert.sql
      - name: Prepare synthetic X post publication and Claim timestamps for source-sweep QA
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-elastic-postclaim-x-sweep-fixture.sql
      - name: Preserve 72h X-post eligibility and active LIVE X before source recycling
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261105215900_reward_elastic_postclaim_x_source_sweep_guard.sql
      - name: Reject source sweeps until pending X opportunities and verifications are terminal
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-elastic-postclaim-x-sweep-assert.sql
      - name: Install fake Production-like referral funding binding trigger
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-elastic-binding-guard-lab.sql
      - name: Harden accepting a future referral without a verified funding receipt
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261105220500_reward_elastic_future_activation_binding_guard.sql
      - name: Verify new unbound invites fail closed without blocking existing accepted users
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-elastic-binding-guard-assert.sql
      - name: Exclude confirmed terminal Sybil BLOCKED from contingent slots
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261105221500_reward_elastic_terminal_sybil_candidate_exclusion.sql
      - name: Prove blocked-but-ACTIVATING users cannot drain clean winner shares or poison funds
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-elastic-blocked-vs-pending-assert.sql
      - name: Release physical collateral only once Claim and 72h X rights have ended
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261106020100_reward_elastic_terminal_contingent_release.sql
      - name: Verify full lifecycle of pending, first Claim, 72h X, terminal release and later X proof
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-elastic-terminal-contingent-release-assert.sql
      - name: Install strict original canonical pool-debit guard in fake PG17 schema
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-elastic-canonical-self-escrow-lab.sql
      - name: Permit only exact same-cohort escrow conversion and reject underfunded pool
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261106030300_reward_elastic_canonical_own_escrow_exact_transfer.sql
      - name: Verify 2 full-pool Claim reservations, Sybil/closure authority, other-payer isolation and replay
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/reward-elastic-canonical-self-escrow-assert.sql
