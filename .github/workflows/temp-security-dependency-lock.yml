name: Temporary dependency lock refresh

on:
  push:
    branches:
      - fix/security-next-sentry-20261023

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/security-next-sentry-20261023
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh only patched direct dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact \
            next@16.4.2 \
            @sentry/nextjs@10.76.2

      - name: Verify requested versions
        run: |
          node -e "const p=require('./package.json'); if(p.dependencies.next!=='16.4.2'||p.dependencies['@sentry/nextjs']!=='10.76.2') process.exit(1)"
          node -e "const l=require('./package-lock.json'); if(l.packages['node_modules/next'].version!=='16.4.2'||l.packages['node_modules/@sentry/nextjs'].version!=='10.76.2') process.exit(1)"

      - name: Commit lock refresh and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-security-dependency-lock.yml
          git add package.json package-lock.json
          git commit -m "Patch Next.js and Sentry security advisories"
          git push origin HEAD:fix/security-next-sentry-20261023
