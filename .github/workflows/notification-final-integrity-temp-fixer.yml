name: Fix notification integrity temp patch runner

on:
  push:
    branches:
      - fix/notification-final-integrity

permissions:
  contents: write

jobs:
  fix-runner:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notification-final-integrity
      - name: Fix generated file newlines and retrigger patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/notification-final-integrity-temp.yml')
          text = path.read_text()
          text = text.replace(
              "    if: github.actor != 'github-actions[bot]'",
              "    if: true",
              1,
          )
          marker = "          manifest = Path('supabase/production-migration-manifest.txt')\n"
          if marker not in text:
              raise SystemExit('migration normalization marker not found')
          text = text.replace(
              marker,
              "          migration.write_text(migration.read_text().replace(r'\\n', '\\n'))\n\n" + marker,
              1,
          )
          end_marker = "          PY\n      - name: Run focused regression tests\n"
          if end_marker not in text:
              raise SystemExit('final test normalization marker not found')
          text = text.replace(
              end_marker,
              "          final_test.write_text(final_test.read_text().replace(r'\\n', '\\n'))\n          PY\n      - name: Run focused regression tests\n",
              1,
          )
          path.write_text(text)
          PY
          rm .github/workflows/notification-final-integrity-temp-fixer.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix notification integrity patch runner"
          git push origin HEAD:fix/notification-final-integrity
