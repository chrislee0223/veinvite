name: Network Finalize Once

on:
  push:
    branches:
      - restore/network-final-interactions

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: restore/network-final-interactions
          fetch-depth: 0

      - name: Apply guarded Network patch
        run: node scripts/network-finalize-pass1.mjs

      - name: Verify patch contract
        run: |
          git diff --check
          node --test tests/network-single-runtime.test.mjs

      - name: Commit finalized Network pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/network-finalize-pass1.mjs .github/workflows/network-finalize-once.yml
          git add src/components/AppNetwork.tsx tests/network-single-runtime.test.mjs
          git commit -m "Restore final Network controls and grouping behavior"
          git push origin HEAD:restore/network-final-interactions
