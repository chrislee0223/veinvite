name: Diagnose Reward Transaction

on:
  push:
    branches:
      - diagnose/reward-tx-647f
    paths:
      - '.github/workflows/diagnose-reward-tx.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Query VeChain mainnet transaction and receipt
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { ThorClient } from '@vechain/sdk-network';
          import { Hex, Transaction } from '@vechain/sdk-core';

          const txId = '0x647f25337c765e1dbb91024214b20f232e5d2c86fc33933c94443c576d0671b1';
          const rawTxHex = '';
          const thor = ThorClient.at('https://mainnet.vechain.org');
          const decoded = Transaction.decode(Hex.of(rawTxHex).bytes, true);
          const body = decoded.body;
          const blockRef = String(body.blockRef);
          const blockRefNumber = Number.parseInt(blockRef.slice(2, 10), 16);
          const expiration = Number(body.expiration);
          const expiryBlock = blockRefNumber + expiration;
          const best = await thor.blocks.getBestBlockCompressed();
          const finalized = await thor.blocks.getFinalizedBlockCompressed();
          const tx = await thor.transactions.getTransaction(txId, { pending: true });
          const receipt = await thor.transactions.getTransactionReceipt(txId);

          console.log(JSON.stringify({
            txId,
            decodedTxId: decoded.id.toString().toLowerCase(),
            blockRef,
            blockRefNumber,
            expiration,
            expiryBlock,
            bestBlock: best?.number ?? null,
            finalizedBlock: finalized?.number ?? null,
            foundTransaction: Boolean(tx),
            transactionMeta: tx?.meta ?? null,
            foundReceipt: Boolean(receipt),
            receiptReverted: receipt?.reverted ?? null,
          }, null, 2));
          NODE
