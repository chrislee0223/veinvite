name: WalletConnect vulnerability remediation probe

on:
  pull_request:
    paths:
      - 'package.json'
      - '.github/workflows/security-lockfile-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Generate lockfile from reviewed pinned override
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Verify that resulting lockfile has no high vulnerabilities
        run: npm audit --audit-level=high
      - name: Commit audited lockfile to this same-repo PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security(lockfile): reconcile WalletConnect utility override"
            git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          else
            echo "Generated lockfile already matches the repository."
          fi
      - name: Upload generated lockfile and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-remediation-lockfile-${{ github.run_id }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 5
