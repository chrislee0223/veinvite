name: WalletConnect vulnerability remediation probe

on:
  pull_request:
    paths:
      - 'package.json'
      - '.github/workflows/security-lockfile-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Generate lockfile from reviewed pinned override
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Verify that resulting lockfile has no high vulnerabilities
        run: npm audit --audit-level=high
      - name: Upload generated lockfile and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-remediation-lockfile-${{ github.run_id }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 5
