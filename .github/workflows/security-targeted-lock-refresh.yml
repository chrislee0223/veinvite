name: Security targeted lockfile refresh (temporary)

on:
  push:
    branches:
      - security/targeted-next-hono-20261118

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh lock without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify explicit security patch targets
        run: |
          node - <<'NODE'
          const p = require('./package.json');
          const l = require('./package-lock.json');
          if (p.dependencies.next !== '16.4.6') throw new Error('next patch target changed');
          if (p.overrides.hono !== '4.13.18') throw new Error('hono patch target changed');
          if (l.packages['node_modules/next'].version !== '16.4.6') throw new Error('next lock mismatch');
          for (const [name, meta] of Object.entries(l.packages)) {
            if ((name === 'node_modules/hono' || name.endsWith('/node_modules/hono')) && meta.version !== '4.13.18') {
              throw new Error('unpatched hono ' + name + ': ' + meta.version);
            }
          }
          NODE
      - name: Record dependency resolution
        run: |
          node -e "const l=require('./package-lock.json'); console.log('next='+l.packages['node_modules/next'].version);console.log('hono='+l.packages['node_modules/hono'].version)"
      - name: Commit only deterministic lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): refresh lockfile for verified Next and Hono patches"
            git push origin HEAD:security/targeted-next-hono-20261118
          fi
