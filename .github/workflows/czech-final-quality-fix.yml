name: Czech Final Quality Fix

on:
  push:
    branches:
      - feat/czech-locale

permissions:
  contents: write

jobs:
  update-quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/czech-locale
          fetch-depth: 0
      - name: Update Czech leaderboard copy and 29-locale assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          movement = Path('src/lib/i18n/leaderboardMovementCopy.ts')
          text = movement.read_text()
          if "  cs: {" not in text:
              marker = "  el: {\n    newEntry: 'ΝΕΟ',"
              entry = """  cs: {
            newEntry: 'NOVÝ',
            up: (places) => `O ${places} míst výše než na konci minulého kola`,
            down: (places) => `O ${places} míst níže než na konci minulého kola`,
            same: 'Stejné pořadí jako na konci minulého kola',
            newEntryAria: 'Nově v žebříčku od konce minulého kola',
          },
          """
              if marker not in text:
                  raise SystemExit('leaderboard movement insertion point not found')
              text = text.replace(marker, entry + marker, 1)
              movement.write_text(text)

          test_files = [
              'tests/i18n-final-polish.test.mjs',
              'tests/i18n-leaderboard-rank-movement.test.mjs',
              'tests/i18n-network-native-review.test.mjs',
              'tests/i18n-network-naturalness-polish.test.mjs',
              'tests/i18n-network-user-facing-polish.test.mjs',
          ]
          for name in test_files:
              path = Path(name)
              source = path.read_text()
              source = source.replace('supportedLocales.length, 28', 'supportedLocales.length, 29')
              source = source.replace("'sw', 'ha', 'el',\n];", "'sw', 'ha', 'el', 'cs',\n];")
              source = source.replace('all 28 supported locales', 'all 29 supported locales')
              source = source.replace('all 28 locales', 'all 29 locales')
              path.write_text(source)
          PY

          rm -f .github/workflows/czech-final-quality-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Czech locale quality gates'
          git push origin HEAD:feat/czech-locale
