name: Refresh Claim Queue Lockfile

on:
  push:
    branches:
      - fix/claim-durable-finality-20260915
    paths:
      - package.json
      - .github/workflows/lockfile-refresh-claim-finality.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v7
        with:
          ref: fix/claim-durable-finality-20260915

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Regenerate package lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for durable Claim queue"
          git push origin HEAD:fix/claim-durable-finality-20260915
