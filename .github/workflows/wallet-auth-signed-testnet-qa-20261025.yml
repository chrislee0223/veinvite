name: Signed Testnet Wallet Authentication QA (isolated)

on:
  push:
    branches:
      - integration/x-readiness-zod-security-20261025
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://bpppslplhmppxzvdkwxs.supabase.co
  SUPABASE_SECRET_KEY: ci-placeholder-not-a-real-key
  VERCEL_ENV: preview
  VECHAIN_NETWORK: testnet
  NEXT_PUBLIC_NETWORK_TYPE: test

jobs:
  signed-certificate-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install pinned audited packages
        run: npm ci --no-fund
      - name: Auth signature -> challenge -> cookie -> replay/expiry/logout, isolated mock DB
        run: node --experimental-strip-types --test tests/wallet-auth-certificate-roundtrip.test.mjs
      - name: Existing certificate and session safety suite
        run: node --experimental-strip-types --test tests/wallet-*.test.mjs
      - name: Typecheck
        run: npm run typecheck
