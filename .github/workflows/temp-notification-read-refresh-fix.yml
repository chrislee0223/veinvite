name: Temporary notification read refresh fixer

on:
  push:
    branches:
      - fix/notification-read-no-reload

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notification-read-no-reload
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch notification read refresh behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path

          inapp_path = Path('src/components/InAppInviteNotifications.tsx')
          text = inapp_path.read_text()

          anchor = "const NOTIFICATION_HISTORY_ACKNOWLEDGED_EVENT =\n  'veinvite-notification-history-acknowledged';\n"
          insert = anchor + "const HOME_DATA_REFRESH_REQUESTED_EVENT =\n  'veinvite-home-data-refresh-requested';\n"
          if "HOME_DATA_REFRESH_REQUESTED_EVENT" not in text:
              if anchor not in text:
                  raise SystemExit('InApp event anchor not found')
              text = text.replace(anchor, insert, 1)

          replacements = [
              (
                  """        if (refreshHomeAfterAcknowledgement) {\n          window.location.reload();\n          return;\n        }\n\n        if (wallet) {\n""",
                  """        if (refreshHomeAfterAcknowledgement) {\n          window.dispatchEvent(\n            new Event(HOME_DATA_REFRESH_REQUESTED_EVENT),\n          );\n        }\n\n        if (wallet) {\n""",
              ),
              (
                  """      if (refreshHomeAfterAcknowledgement) {\n        window.location.reload();\n        return;\n      }\n\n      if (wallet) {\n""",
                  """      if (refreshHomeAfterAcknowledgement) {\n        window.dispatchEvent(\n          new Event(HOME_DATA_REFRESH_REQUESTED_EVENT),\n        );\n      }\n\n      if (wallet) {\n""",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit('Expected acknowledgement reload block not found exactly once')
              text = text.replace(old, new, 1)
          if 'window.location.reload()' in text:
              raise SystemExit('Full reload remains in InAppInviteNotifications')
          inapp_path.write_text(text)

          home_path = Path('src/components/HomeClient.tsx')
          home = home_path.read_text()
          home_anchor = "const EVIDENCE_REFRESH_MS = 120_000;\n"
          home_insert = home_anchor + "const HOME_DATA_REFRESH_REQUESTED_EVENT =\n  'veinvite-home-data-refresh-requested';\n"
          if "HOME_DATA_REFRESH_REQUESTED_EVENT" not in home:
              if home_anchor not in home:
                  raise SystemExit('Home event anchor not found')
              home = home.replace(home_anchor, home_insert, 1)

          effect_anchor = """  useEffect(() => {\n    if (!wallet) return;\n\n    const refreshIfVisible = () => {\n      if (document.visibilityState === 'visible') {\n        void load(true);\n      }\n    };\n\n    const timer = window.setInterval(\n      refreshIfVisible,\n      HOME_REFRESH_MS,\n    );\n    document.addEventListener('visibilitychange', refreshIfVisible);\n\n    return () => {\n      window.clearInterval(timer);\n      document.removeEventListener('visibilitychange', refreshIfVisible);\n    };\n  }, [wallet, load]);\n"""
          effect_insert = effect_anchor + """\n  useEffect(() => {\n    if (!wallet) return;\n\n    const refreshHomeData = () => {\n      void load(true);\n    };\n\n    window.addEventListener(\n      HOME_DATA_REFRESH_REQUESTED_EVENT,\n      refreshHomeData,\n    );\n    return () => window.removeEventListener(\n      HOME_DATA_REFRESH_REQUESTED_EVENT,\n      refreshHomeData,\n    );\n  }, [wallet, load]);\n"""
          if "const refreshHomeData = () =>" not in home:
              if effect_anchor not in home:
                  raise SystemExit('Home refresh effect anchor not found')
              home = home.replace(effect_anchor, effect_insert, 1)
          home_path.write_text(home)

          test_path = Path('tests/notification-read-no-full-reload.test.mjs')
          test_path.write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { readFileSync } from 'node:fs';\n\nconst inApp = readFileSync('src/components/InAppInviteNotifications.tsx', 'utf8');\nconst home = readFileSync('src/components/HomeClient.tsx', 'utf8');\n\ntest('reading notifications never performs a full page reload', () => {\n  assert.doesNotMatch(inApp, /window\\.location\\.reload\\(\\)/u);\n  assert.match(inApp, /HOME_DATA_REFRESH_REQUESTED_EVENT/u);\n  const dispatches = inApp.match(/new Event\\(HOME_DATA_REFRESH_REQUESTED_EVENT\\)/gu) ?? [];\n  assert.ok(dispatches.length >= 2);\n});\n\ntest('home data refreshes quietly when notification acknowledgement requires it', () => {\n  assert.match(home, /HOME_DATA_REFRESH_REQUESTED_EVENT/u);\n  assert.match(home, /window\\.addEventListener\\(\\s*HOME_DATA_REFRESH_REQUESTED_EVENT,[\\s\\S]*refreshHomeData/u);\n  assert.match(home, /const refreshHomeData = \\(\\) => \\{\\s*void load\\(true\\);/u);\n  assert.match(home, /window\\.removeEventListener\\(\\s*HOME_DATA_REFRESH_REQUESTED_EVENT,[\\s\\S]*refreshHomeData/u);\n});\n""")
          PY

          node --test tests/notification-read-no-full-reload.test.mjs
          node --test tests/notification-final-integrity.test.mjs
          node --test tests/notification-history-fast-open.test.mjs
          node --test tests/i18n-notification-reward-center.test.mjs

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/InAppInviteNotifications.tsx src/components/HomeClient.tsx tests/notification-read-no-full-reload.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Avoid full reload after notification read"
          git push origin HEAD:fix/notification-read-no-reload
