name: X scan hint isolated regression (QA branch only)
on:
  push:
    branches:
      - qa-x-scan-hint-20261023
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Targeted X scan and existing reward regressions
        run: >-
          node --test
          tests/reward-x-promotion-scan-hint.test.mjs
          tests/reward-x-promotion-auto-discovery.test.mjs
          tests/reward-x-promotion-urlless-rollout.test.mjs
          tests/reward-x-promotion-author-timeline.test.mjs
          tests/reward-x-promotion-monthly-budget.test.mjs
          tests/reward-x-promotion-oauth-callback.test.mjs
          tests/reward-x-promotion-post-lookup-compat.test.mjs
